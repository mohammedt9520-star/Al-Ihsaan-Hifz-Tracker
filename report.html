<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading report…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#0D2318;color:#e8dfc8;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
  .spinner{width:48px;height:48px;border:4px solid #c9a55344;border-top-color:#c9a553;border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:15px;color:#c9a553;letter-spacing:0.5px}
  .err{color:#e74c3c;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <p>Loading report…</p>
</div>
<div id="error" style="display:none">
  <p style="color:#e74c3c;font-size:18px;margin-bottom:8px">⚠ Report not found</p>
  <p class="err" id="errMsg"></p>
</div>
<script>
(function(){
  var SUPABASE_URL="https://yyfkoenhpotzcuwxpnsy.supabase.co";
  var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5ZmtvZW5ocG90emN1d3hwbnN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDM4NzgsImV4cCI6MjA5NTg3OTg3OH0.UDVDhOZgvtMcN89F1hz0725nmVJ7bCLW-BjUxhKZs4g";

  // Compact mobile overrides — injected before document.write so the
  // paper-sized A4 layout becomes a tight, low-scroll mobile view.
  var MOBILE_CSS='<style>'
    +'@media screen{'
    +'body{padding:10px 10px!important;min-height:unset!important;}'
    +'.card{margin-bottom:7px!important;border-radius:10px!important;}'
    +'.sec-hdr{padding:7px 12px!important;font-size:10px!important;border-radius:10px 10px 0 0!important;}'
    +'.meta-cell{padding:7px 10px!important;}'
    +'.meta-lbl{font-size:9px!important;margin-bottom:1px!important;}'
    +'.meta-val{font-size:12px!important;}'
    +'.dtbl td{padding:7px 8px!important;}'
    +'.dtbl .lbl{font-size:9px!important;margin-bottom:2px!important;}'
    +'.dtbl .val{font-size:16px!important;}'
    +'.att-cell{padding:7px 4px!important;}'
    +'.att-lbl{font-size:9px!important;margin-bottom:2px!important;}'
    +'.att-val{font-size:18px!important;}'
    +'.comments-body{padding:10px 12px!important;font-size:12px!important;min-height:unset!important;}'
    +'.footer-inner{padding:12px 14px!important;font-size:11px!important;}'
    +'.rpt-header{margin-bottom:10px!important;gap:12px!important;}'
    +'.rpt-title{font-size:18px!important;}'
    +'.rpt-title-sub{font-size:10px!important;}'
    +'.legend{padding:6px 0!important;gap:8px!important;font-size:10px!important;}'
    +'.pg-num{margin:6px 0 0!important;}'
    +'}'
    +'</style>';

  var id=new URLSearchParams(window.location.search).get("id");
  if(!id){showError("No report ID in URL.");return;}
  fetch(SUPABASE_URL+"/rest/v1/report_store?id=eq."+encodeURIComponent(id)+"&select=html_content",{
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
  })
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(rows){
    if(!rows||!rows.length||!rows[0].html_content){throw new Error("Report not found.");}
    // Inject mobile CSS just before </head> so it overrides the paper styles
    var html=rows[0].html_content.replace('</head>',MOBILE_CSS+'</head>');
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(e){showError(e.message||"Unknown error");});
  function showError(msg){
    document.getElementById("loading").style.display="none";
    document.getElementById("error").style.display="";
    document.getElementById("errMsg").textContent=msg;
  }
})();
</script>
</body>
</html>
