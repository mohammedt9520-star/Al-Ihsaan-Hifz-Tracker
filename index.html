async function sbFetch(path,method,body){
  const h={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+(await sbGetToken()),"Content-Type":"application/json"};
  if(method==="POST"||method==="PATCH")h["Prefer"]="resolution=merge-duplicates";
  if(method==="DELETE")h["Prefer"]="return=minimal";
  const opts={method:method||"GET",headers:h};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,opts);
  if(!r.ok){
    const e=typeof r.text==="function"?await r.text().catch(()=>""):String(r.status||"error");
    throw new Error(r.status+": "+e.substring(0,100));
  }
  if(r.status===204)return [];
  try{return await r.json();}catch(e){throw new Error("Invalid JSON response from server");}
}
async function sbUpsert(table,rows,conflictCol="id"){
  if(!rows||rows.length===0)return;
  for(let i=0;i<rows.length;i+=500){await sbFetch(table+"?on_conflict="+conflictCol,"POST",rows.slice(i,i+500));}
}
async function sbFetchAll(q){
  // Max 100 pages (100k rows) — sufficient for 5+ years of register data
  let all=[],offset=0,maxPages=100;
  while(maxPages-->0){
    const sep=q.includes("?")?"&":"?";
    const rows=await sbFetch(q+sep+"limit=1000&offset="+offset,"GET");
    if(!Array.isArray(rows))break;
    all=[...all,...rows];
    if(rows.length<1000)break;
    offset+=1000;
  }
  return all;
}

// Replaces all alert() / confirm() / prompt() browser dialogs

// ── Global toast state (imperative API via module-level ref) ──
var _toastQueue=[];
var _toastSetState=null;

function showToast(msg,type,duration){
  type=type||"info"; duration=duration||3200;
  if(_toastSetState){
    _toastSetState(function(prev){
      var id=Date.now()+Math.random();
      setTimeout(function(){
        if(_toastSetState)_toastSetState(function(q){return q.filter(function(t){return t.id!==id;});});
      },duration);
      return[...prev,{id:id,msg:msg,type:type}];
    });
  }
}

function Toast(){
  var pair=React.useState([]);
  var toasts=pair[0],setToasts=pair[1];
  _toastSetState=setToasts;
  if(!toasts.length)return null;
  var STYLES={
    success:{bg:"#16a34a",icon:"✅"},
    error:{bg:"#dc2626",icon:"âŒ"},
    warning:{bg:"#d97706",icon:"⚠️"},
    info:{bg:"#1a3a3a",icon:"ℹ️"},
  };
  return React.createElement("div",{
    style:{position:"fixed",bottom:"calc(env(safe-area-inset-bottom,0px) + 88px)",
      left:16,right:16,zIndex:9000,display:"flex",flexDirection:"column",gap:8,
      alignItems:"center",pointerEvents:"none"}
  },
    toasts.map(function(t){
      var s=STYLES[t.type]||STYLES.info;
      return React.createElement("div",{key:t.id,
        style:{background:s.bg,color:"#fff",padding:"12px 18px",borderRadius:14,
          maxWidth:520,width:"100%",fontSize:13,fontWeight:"600",
          boxShadow:"0 8px 30px rgba(0,0,0,0.28)",
          display:"flex",alignItems:"flex-start",gap:10,
          animation:"none",pointerEvents:"auto"}
      },
        React.createElement("span",{style:{fontSize:16,flexShrink:0}},s.icon),
        React.createElement("span",{style:{flex:1,lineHeight:1.5}},t.msg)
      );
    })
  );
}

// ── ConfirmModal ──────────────────────────────────────────────
var _confirmResolve=null;
var _confirmSetState=null;

function showConfirm(message,title){
  return new Promise(function(resolve){
    _confirmResolve=resolve;
    if(_confirmSetState)_confirmSetState({open:true,message:message,title:title||"Confirm"});
  });
}

function ConfirmModal(){
  var pair=React.useState({open:false,message:"",title:"Confirm"});
  var state=pair[0],setState=pair[1];
  _confirmSetState=setState;
  if(!state.open)return null;
  function respond(yes){
    setState({open:false,message:"",title:"Confirm"});
    if(_confirmResolve){_confirmResolve(yes);_confirmResolve=null;}
  }
  return React.createElement("div",{
    style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",
      zIndex:8000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}
  },
    React.createElement("div",{
      style:{background:"#fff",borderRadius:20,padding:28,maxWidth:420,width:"100%",
        boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}
    },
      React.createElement("div",{style:{color:"#1a1f2e",fontWeight:"700",fontSize:17,marginBottom:12}},
        state.title),

function normQuarter(q){const s=String(q||"").trim();if(/^q[1-4]$/i.test(s))return s.slice(1);return s;}
function heatQuarter(q){let s=normQuarter(q);if(s==="1st Half"||s==="1H")return"1";if(s==="2nd Half"||s==="2H")return"3";return /^[1-4]$/.test(s)?s:null;}
function buildHeatmap(dorRecords,studentName,dateFrom,dateTo){
  if(!Array.isArray(dorRecords))return{};
  const entries=dorRecords.filter(d=>
    d.studentName===studentName&&
    (!dateFrom||d.date>=dateFrom)&&
    (!dateTo||d.date<=dateTo)
  );
  // Track which juz entries are Para Dor
  const paraDorJuzSet=new Set();
  entries.forEach(e=>{
    if(e.paraDor){
      if(e.dor1Juz)paraDorJuzSet.add(String(e.dor1Juz));
      if(e.dor2Juz)paraDorJuzSet.add(String(e.dor2Juz));
    }
  });
  // Group by juz+quarter+date, pick best (lowest mistakes) per same date
  const byKey={};
  entries.forEach(entry=>{
    [[entry.dor1Juz,entry.dor1Quarter,entry.dor1Mistakes,entry.dor1Repeated],
     [entry.dor2Juz,entry.dor2Quarter,entry.dor2Mistakes,entry.dor2Repeated]
    ].forEach(([juz,q,m,rep])=>{
      if(!juz||!q)return;
      const qn=heatQuarter(q);
      if(!qn)return;
      const noTimeOnly=(m===""||m===undefined||m===null);
      if(noTimeOnly)return;
      const key=juz+"-"+qn+"-"+entry.date;
      const ex=byKey[key];
      if(!ex||parseFloat(m)<parseFloat(ex.mistakes)){
        byKey[key]={juz:String(juz),quarter:qn,mistakes:m,repeated:rep,date:entry.date};
      }
    });
  });
  // Build heatmap: juz -> quarter -> array of colors
  const heatmap={};
  Object.values(byKey).forEach(({juz,quarter,mistakes,repeated})=>{
    if(!heatmap[juz])heatmap[juz]={};
    if(!heatmap[juz][quarter])heatmap[juz][quarter]=[];
    const color=getDorColor(mistakes,repeated);
    if(color)heatmap[juz][quarter].push(color);
  });
  heatmap._paraDorJuz=paraDorJuzSet;
  return heatmap;
}

function calcDorTotals(heatmap){
  if(!heatmap||typeof heatmap!=="object")return{completeJuz:0,remainingQ:0,totalMistakes:0};
  let completeJuz=0,remainingQ=0;
  Object.keys(heatmap).filter(k=>!isNaN(Number(k))&&Number(k)>0).forEach(juz=>{
    const done=[1,2,3,4].filter(q=>heatmap[juz]&&heatmap[juz][q]&&heatmap[juz][q].length>0).length;
    if(done===4)completeJuz++;
    else remainingQ+=done;
  });
  return{completeJuz,remainingQ};
}

// ── SHA-256 password hashing (crypto.subtle) ──────────────────
// Replaces btoa() encoding. Async; callers that need sync result
// use the cached stored value only for comparison.
async function _hashPwdAsync(p){
  const enc=new TextEncoder();
  const data=enc.encode(String(p)+"_alhsaan_hifz");
  const buf=await crypto.subtle.digest("SHA-256",data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Synchronous check: compares already-stored hash against hash of input.
// Both sides are SHA-256 hex strings stored in localStorage.
function getAdminPassword(){
  try{return localStorage.getItem("adminPassword")||"";}
  catch(e){return"";}
}
async function setAdminPassword(p){
  const h=await _hashPwdAsync(p);
  try{localStorage.setItem("adminPassword",h);}catch(e){}
  sbUpsert("app_settings",[{key:"adminPassword",value:h,updated_at:new Date().toISOString()}]).catch(()=>{});
}
async function checkAdminPassword(p){
  const stored=getAdminPassword();
  if(!stored)return false;
  const h=await _hashPwdAsync(p);
  // Hash-only — legacy plaintext fallback removed
  return stored===h;
}

// ── DATA SANITISATION ─────────────────────────────────────────
// Called after loading from localStorage or Supabase to fix any corrupt values
function sanitiseRecord(r){
  if(!r||typeof r!=="object")return null;
  if(!r.id||!r.name)return null;
  // V7: blank/invalid class â†’ default to first class
  const _safeClass=CLASSES.includes(r.class)?r.class:CLASSES[0];
  var out={
    ...r,
    class: _safeClass,
    // V1: totalFullSides cap 0-9999
    totalFullSides: String(Math.max(0,Math.min(9999,parseFloat(r.totalFullSides)||0))),
    // plusLines cap 0-12
    plusLines:       String(Math.max(0,Math.min(12,parseInt(r.plusLines)||0))),
    // V2/V3/V4: absences, paraDorMornings, totalDaysOfSabaq — all capped 0-31
    absences:        String(Math.max(0,Math.min(31,parseInt(r.absences)||0))),
    paraDorMornings: String(Math.max(0,Math.min(31,parseInt(r.paraDorMornings)||0))),
    totalDaysOfSabaq:String(Math.max(0,Math.min(31,parseInt(r.totalDaysOfSabaq)||0))),
    // V5/V6: evening attendance caps
    eveningPossibleDays:String(Math.max(0,Math.min(31,parseInt(r.eveningPossibleDays)||0))),
    eveningAbsences: String(Math.max(0,Math.min(31,parseInt(r.eveningAbsences)||0))),
    targetGiven:     Math.max(1,Math.min(50,parseInt(r.targetGiven)||13)),
    upcomingTarget:  Math.max(1,Math.min(50,parseInt(r.upcomingTarget)||13)),
    behaviour:       Math.max(1,Math.min(5,parseInt(r.behaviour)||5)),
    dateFrom:        /^\d{4}-\d{2}-\d{2}$/.test(r.dateFrom||"")?r.dateFrom:"",
    dateTo:          /^\d{4}-\d{2}-\d{2}$/.test(r.dateTo||"")?r.dateTo:"",
    weakSabaqInstances: r.weakSabaqInstances||"N/A",
    weakDorInstances:   r.weakDorInstances||"N/A",
  };
  // V8: cross-field — absences+paraDorMornings must not exceed totalDaysOfSabaq
  var _tds=parseInt(out.totalDaysOfSabaq)||0;
  var _abs=parseInt(out.absences)||0;
  var _pdm=parseInt(out.paraDorMornings)||0;
  if(_abs+_pdm>_tds){out.paraDorMornings=String(Math.max(0,_tds-_abs));}
  return out;
}

// HTML escape — every user value written into HTML strings must use this
function esc(v){
  if(v===null||v===undefined)return"";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function calcEntry(s){
  const E=parseFloat(s.totalFullSides)||0,F=parseFloat(s.plusLines)||0;
  const G=parseFloat(s.absences)||0,H=parseFloat(s.paraDorMornings)||0;
  const N=parseFloat(s.totalDaysOfSabaq)||0;
  const O=parseFloat(s.targetGiven)||13,Q=parseFloat(s.upcomingTarget)||13;
  const I=E*13+F;
  const J=Math.max(0,N-H-G); // clamp: sabaq days cannot be negative
  const K=J>0?I/J:0,P=O*13;
  const R=(N-H)>0?I/(N-H):0;
  const S_val=H>0?(I+K*H)/N:(N>0?I/N:0);
  const T=parseFloat((S_val*N/13).toFixed(3));
  const U=parseFloat((S_val/13).toFixed(4));
  // Total possible days = sabaq days attended + absences
  const totalPossibleDays=N+G;
  const totalAttended=N;
  const attendancePct=totalPossibleDays>0?(totalAttended/totalPossibleDays)*100:0;
  const totalAvgPages=I>0?I/13:0;
  let monthName="";
  if(s.dateFrom){try{const d=new Date(s.dateFrom);if(!isNaN(d.getTime()))monthName=d.toLocaleString("default",{month:"long",year:"numeric"});}catch(e){}}
  // ── Sabaq Champion fields (spec v2.4) ──────────────────
  // Step 1: totalLines = I (already computed above)
  // Step 2: sabaqDays
  const sabaqDays = J; // = max(0, N - H - G)
  // Step 3: average lines per sabaq day
  const average = sabaqDays > 0 ? I / sabaqDays : 0;
  // Step 4: trueAverage — absences hurt, Para Dor does NOT
  const trueAverage = (N - H) > 0 ? I / (N - H) : 0;
  // Step 5: adjustedLines — credit Para Dor at student's own trueAverage
  const adjustedLines = I + (trueAverage * H);
  // Step 6: championTotalSides
  const championTotalSides = adjustedLines / 13;
  // Step 7: championDailyAverage — divide by ALL days (Para Dor already credited)
  const championDailyAverage = N > 0 ? championTotalSides / N : 0;
  return{I,J,K,P,R,S:S_val,T,U,O,Q,G,H,N,totalAttended,attendancePct,totalAvgPages,monthName,
    sabaqDays,average,trueAverage,adjustedLines,championTotalSides,championDailyAverage};
}

function getMonthRange(dateFrom, dateTo){
  if(!dateFrom||!dateTo)return"";
  const d1=new Date(dateFrom), d2=new Date(dateTo);
  if(isNaN(d1.getTime())||isNaN(d2.getTime()))return"";
  const m1=d1.toLocaleString("default",{month:"long"});
  const m2=d2.toLocaleString("default",{month:"long"});
  const y1=d1.getFullYear(), y2=d2.getFullYear();
  if(m1===m2&&y1===y2)return m1+" "+y1;
  if(y1===y2)return m1+"/"+m2+" "+y1;
  return m1+" "+y1+"/"+m2+" "+y2;
}

// DOR ENTRY PAGE

function DorEntryPage({studentNames,dorRecords,setDorRecords,records,yearPlan,registerData,setRegisterData,syncNow}){
  const today=getTodayStr();
  const EV_QUARTERS=[["1","Q1"],["2","Q2"],["3","Q3"],["4","Q4"],["1st Half","1st Half"],["2nd Half","2nd Half"]];
  const EV_MK=[];for(let m=0;m<=10;m+=0.5)EV_MK.push(m);

  const _studentsByClass=React.useMemo(()=>{
    const m={};
    (records||[]).forEach(r=>{if(r.class&&r.name&&!r.name.startsWith("(")){
      if(!m[r.class])m[r.class]=new Set(); m[r.class].add(r.name);
    }});
    return m;
  },[records]);
  function getClassStudents(c){return [...(_studentsByClass[c]||new Set())].sort();}

  const EMPTY_EV=name=>({name,absent:false,
    d1Juz:"",d1Quarter:"",d1Mistakes:"",d1Scrape:false,d1Kaccha:false,d1NoTime:false,d1ParaDor:false,
    d2Juz:"",d2Quarter:"",d2Mistakes:"",d2Scrape:false,d2Kaccha:false,d2NoTime:false,d2Exempt:false,d2ParaDor:false,
    ptOpen:false,ptJuz:"",ptMistakes:"",ptResult:"Passed"});

  function initEV(name,c,d){
    const base=EMPTY_EV(name);
    const sv=(dorRecords||[]).find(e=>e.studentName===name&&e.date===d);
    const rk=getRegisterKey(c,"evening",d);
    const reg=(registerData||[]).find(r=>r.key===rk&&r.studentName===name);
    const absent=!!(reg&&(reg.status==="A"||reg.status==="AG"));
    if(!sv)return{...base,absent};
    return{...base,absent,
      d1Juz:sv.dor1Juz||"",d1Quarter:normQuarter(sv.dor1Quarter||""),
      d1Mistakes:(sv.dor1Mistakes!==undefined&&sv.dor1Mistakes!==null&&sv.dor1Mistakes!=="")?String(sv.dor1Mistakes):"",
      d1Scrape:!!sv.dor1Scrape,d1Kaccha:!!sv.dor1Repeated,d1NoTime:!!sv.dor1NoTime,d1ParaDor:!!sv.paraDor,
      d2Juz:sv.dor2Juz||"",d2Quarter:normQuarter(sv.dor2Quarter||""),
      d2Mistakes:(sv.dor2Mistakes!==undefined&&sv.dor2Mistakes!==null&&sv.dor2Mistakes!=="")?String(sv.dor2Mistakes):"",
      d2Scrape:!!sv.dor2Scrape,d2Kaccha:!!sv.dor2Repeated,d2NoTime:!!sv.dor2NoTime,d2Exempt:!!sv.dor2Exempt,d2ParaDor:!!sv.dor2ParaDor,
      ptOpen:!!sv.paraTest,ptJuz:sv.paraTestJuz||"",ptMistakes:sv.paraTestTotalMistakes||"",ptResult:sv.paraTestResult||"Passed"};
  }

  const [cls,setCls]=React.useState("HIFZ CLASS A");
  const [date,setDate]=React.useState(today);
  const [rows,setRows]=React.useState(()=>getClassStudents("HIFZ CLASS A").map(n=>initEV(n,"HIFZ CLASS A",today)));
  const [queueIdx,setQueueIdx]=React.useState(null);
  const [status,setStatus]=React.useState("");

  React.useEffect(()=>{
    setRows(getClassStudents(cls).map(n=>initEV(n,cls,date)));
    setQueueIdx(null);
  },[cls,date]);

  function updRow(i,f,v){
    const name=rows[i]&&rows[i].name;
    setRows(prev=>{const n=[...prev];n[i]={...n[i],[f]:v};return n;});
    if(f==="absent"&&name&&typeof setRegisterData==="function"){
      const key=getRegisterKey(cls,"evening",date);
      setRegisterData(prev=>{
        const idx=prev.findIndex(r=>r.key===key&&r.studentName===name);
        const cur=idx>=0?prev[idx]:{key,class:cls,session:"evening",date,studentName:name,status:"P",minutesLate:0,absenceReason:"",madeUp:false,msgSent:false};
        const upd={...cur,status:v?"A":"P"};
        let next;
        if(idx>=0){next=[...prev];next[idx]=upd;}else{next=[...prev,upd];}
        lsSaveRegister(next);
        return next;
      });
      scheduleSync();
    }
  }

  function qShort(qv){
    if(!qv)return"";
    if(qv==="1st Half")return"1H";
    if(qv==="2nd Half")return"2H";
    return String(qv).replace(/^Q/i,"");
  }
  function evHasD1(r){return !!(r.d1Juz&&r.d1Quarter&&(r.d1Mistakes!==""||r.d1NoTime));}
  function evHasD2(r){return !r.d2Exempt&&!!(r.d2Juz&&r.d2Quarter&&(r.d2Mistakes!==""||r.d2NoTime));}
  function evHasPT(r){return !!(r.ptOpen&&r.ptJuz&&r.ptResult);}
  function evEntered(r){return r.absent||evHasD1(r)||evHasD2(r)||evHasPT(r)||r.d1ParaDor;}
  function evRowBg(r){
    if(r.absent)return{bg:"#F3F4F6",dim:true};
    if(!evEntered(r))return{bg:"#fff",dim:false};
    if(r.d1Kaccha||r.d2Kaccha)return{bg:"#FEF2F2",dim:false};
    if(r.d1Scrape||r.d2Scrape)return{bg:"#FFF7ED",dim:false};
    if(evHasD1(r)&&(evHasD2(r)||r.d2Exempt))return{bg:"#ECFDF5",dim:false};
    return{bg:"#fff",dim:false};
  }
  function evDot(r){
    if(r.absent)return"#9CA3AF";
    if(!evEntered(r))return"#E5E7EB";
    if(r.d1Kaccha||r.d2Kaccha)return"#EF4444";
    if(r.d1Scrape||r.d2Scrape)return"#F59E0B";
    return"#22c55e";
  }
  function evBadge(txt,color,bg){return React.createElement('span',{style:{fontSize:9,fontWeight:"800",color:color,background:bg,border:"1px solid "+color+"33",borderRadius:6,padding:"1px 6px",marginLeft:5,letterSpacing:"0.3px",verticalAlign:"1px"}},txt);}

  function saveEvening(){
    const toSave=rows.filter(r=>!r.absent&&(evHasD1(r)||evHasD2(r)||evHasPT(r)||r.d1ParaDor));
    const hasAny=toSave.length>0||rows.some(r=>r.absent);
    if(!hasAny){setStatus("\u274C Nothing entered yet.");setTimeout(()=>setStatus(""),2000);return;}
    const recs=toSave.map(r=>({
      id:uid(),studentName:r.name,date:date,
      dor1Juz:evHasD1(r)?String(r.d1Juz):"",
      dor1Quarter:evHasD1(r)?normQuarter(r.d1Quarter):"",
      dor1Mistakes:(evHasD1(r)&&!r.d1NoTime)?String(parseFloat(r.d1Mistakes)||0):"",
      dor1Repeated:!!(evHasD1(r)&&r.d1Kaccha),
      dor1Scrape:!!(evHasD1(r)&&r.d1Scrape),
      dor1NoTime:!!(evHasD1(r)&&r.d1NoTime),
      dor2Juz:evHasD2(r)?String(r.d2Juz):"",
      dor2Quarter:evHasD2(r)?normQuarter(r.d2Quarter):"",
      dor2Mistakes:(evHasD2(r)&&!r.d2NoTime)?String(parseFloat(r.d2Mistakes)||0):"",
      dor2Repeated:!!(evHasD2(r)&&r.d2Kaccha),
      dor2Scrape:!!(evHasD2(r)&&r.d2Scrape),
      dor2NoTime:!!(evHasD2(r)&&r.d2NoTime),
      dor2Exempt:!!r.d2Exempt,
      paraDor:!!(r.d1ParaDor||r.d2ParaDor),
      dor2ParaDor:!!r.d2ParaDor,
      paraTest:evHasPT(r),
      paraTestJuz:evHasPT(r)?String(r.ptJuz):"",
      paraTestTotalMistakes:evHasPT(r)?String(r.ptMistakes||""):"",
      paraTestResult:evHasPT(r)?r.ptResult:""
    }));
    setDorRecords(prev=>{
      const names=new Set(recs.map(s=>s.studentName));
      const f=prev.filter(e=>!(e.date===date&&names.has(e.studentName)));
      const n=[...f,...recs];lsSaveDor(n);return n;
    });
    scheduleSync();
    setStatus("\u2705 Saved "+recs.length+" evening records \u2014 syncing\u2026");
    if(typeof syncNow==="function"){syncNow().then(()=>setStatus("\u2705 Evening records saved & synced")).catch(()=>setStatus("\u2705 Saved locally \u2014 will sync when online"));}
    setTimeout(()=>setStatus(""),3500);
  }

  const students=getClassStudents(cls);
  const doneCnt=rows.filter(evEntered).length;
  const q=queueIdx!==null?rows[queueIdx]:null;

  function toggleChip(active,label,color,onClick,disabled){
    return React.createElement('button',{key:label,onClick:disabled?undefined:onClick,
      style:{padding:"7px 12px",borderRadius:10,cursor:disabled?"default":"pointer",fontSize:11,fontWeight:"700",
        background:active?color:"#fff",color:active?"#fff":(disabled?"#D1D5DB":"#6b7280"),
        border:"1.5px solid "+(active?color:"#E5E7EB"),opacity:disabled?0.5:1,letterSpacing:"0.2px"}},label);
  }
  function dorBlock(p,label,accent){

function calcDorChampions(dorRecords, records, dateFrom, dateTo){
  const realRecs=records.filter(r=>!r.isStudentProfile);
  const classA=[...new Set(realRecs.filter(r=>r.class==="HIFZ CLASS A").map(r=>r.name))];
  const classB=[...new Set(realRecs.filter(r=>r.class==="HIFZ CLASS B").map(r=>r.name))];
  const refRecord=records.find(r=>r.dateFrom===dateFrom&&r.dateTo===dateTo);
  const eveningSessions=refRecord?(parseFloat(refRecord.eveningPossibleDays)||0):0;
  const maxQuarters=eveningSessions*2;
  function champForClass(names){
    const studentStats=names.map(name=>{
      const entries=dorRecords.filter(d=>d.studentName===name&&(!dateFrom||d.date>=dateFrom)&&(!dateTo||d.date<=dateTo)&&!d.paraDor);
      const byKey={};
      entries.forEach(entry=>{
        [[entry.dor1Juz,entry.dor1Quarter,entry.dor1Mistakes,entry.dor1Repeated],
         [entry.dor2Juz,entry.dor2Quarter,entry.dor2Mistakes,entry.dor2Repeated]
        ].forEach(([juz,q,m,rep])=>{
          if(!juz||!q||m===""||m===undefined)return;
          const key=juz+"-"+q+"-"+entry.date;
          const ex=byKey[key];
          if(!ex||parseFloat(m)<parseFloat(ex.mistakes))byKey[key]={juz,quarter:q,mistakes:parseFloat(m),repeated:rep,date:entry.date};
        });
      });
      let cleanQuarters=0,totalMistakes=0,hasRedOrRepeat=false;
      Object.values(byKey).forEach(({mistakes,repeated})=>{
        const color=getDorColor(mistakes,repeated);
        if(color==="red")hasRedOrRepeat=true;
        if(repeated)hasRedOrRepeat=true;
        cleanQuarters++;totalMistakes+=mistakes;
      });
      return{name,cleanQuarters,totalMistakes,hasRedOrRepeat};
    }).filter(s=>s.cleanQuarters>0);
    const cleanStudents=studentStats.filter(s=>!s.hasRedOrRepeat);
    let qualifyingQ=0;
    if(cleanStudents.length>0)qualifyingQ=Math.max(...cleanStudents.map(s=>s.cleanQuarters));
    else if(studentStats.length>0)qualifyingQ=Math.max(...studentStats.map(s=>s.cleanQuarters));
    const pool=cleanStudents.length>0?cleanStudents:studentStats;
    const qualifiers=pool.filter(s=>s.cleanQuarters>=qualifyingQ).sort((a,b)=>a.totalMistakes-b.totalMistakes);
    const allRanked=[...studentStats].sort((a,b)=>b.cleanQuarters-a.cleanQuarters||a.totalMistakes-b.totalMistakes);
    return{first:qualifiers[0]||null,second:qualifiers[1]||null,qualifyingQ,maxQ:maxQuarters||qualifyingQ,allRanked};
  }
  return{classA:champForClass(classA),classB:champForClass(classB)};
}

function getAvailablePeriods(records){
  // Group by dateFrom month+year only — ignore exact day and dateTo differences
  // This ensures all students from the same monthly import batch appear as one period
  const seen={};
  (Array.isArray(records)?records:[]).filter(r=>!r.isStudentProfile).forEach(r=>{
    if(!r.dateFrom)return;
    // Key = year-month of dateFrom (e.g. "2026-03")
    const key=r.dateFrom.substring(0,7);
    if(!seen[key]){
      seen[key]={dateFrom:r.dateFrom,dateTo:r.dateTo||r.dateFrom,label:"",key};
    } else {
      if(r.dateFrom<seen[key].dateFrom)seen[key].dateFrom=r.dateFrom;
      if((r.dateTo||r.dateFrom)>seen[key].dateTo)seen[key].dateTo=r.dateTo||r.dateFrom;
    }
  });
  // Build labels after collecting all dates
  const result=Object.values(seen).map(p=>({...p,label:getMonthRange(p.dateFrom,p.dateTo)})).filter(p=>p.label);
  return result.sort((a,b)=>(b.dateFrom||"").localeCompare(a.dateFrom||""));
}

// Match a record to a period - check if its label matches
function recordMatchesPeriod(r,period){
  if(!r.dateFrom||!period)return false;
  // Match by dateFrom month/year key (same as how periods are grouped)
  return r.dateFrom.substring(0,7)===period.dateFrom.substring(0,7);
}

  function importXLSX(e){
    const file=e.target&&e.target.files&&e.target.files[0];
    if(!file)return;
    // If CSV, delegate to original importCSV logic
    if(file.name.toLowerCase().endsWith(".csv")){importCSV(e);return;}
    const reader=new FileReader();
    reader.onerror=function(){showToast("Could not read file.","error");};
    reader.onload=function(ev){
      try{
        if(typeof XLSX==="undefined"){
          showToast("XLSX library not loaded yet — please wait a moment and try again.","warning");
          return;
        }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        if(rows.length<2){showToast("Workbook appears empty. Please check the file contains data rows.","error");return;}
        // I1: Detect wrong column layout — a row is only a data row if col B (Name) has content.
        // Rows with only col A content (pre-numbered placeholders) are not data rows.
        var _dataRows=rows.slice(1).filter(function(r){return String(r[1]||"").trim();});
        if(_dataRows.length===0){
          showToast("⚠️ No names found in column B. Use 'Download XLSX Template' to get the correct format.","warning");
          return;
        }

        function cleanNum(v){const n=parseFloat(String(v||"").replace(/[^0-9.\-]/g,""));return isNaN(n)?"":String(n);}
        function cleanDate(v){
          if(!v)return "";
          if(typeof v==="number"){
            const d=new Date(Math.round((v-25569)*86400*1000));
            return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
          }
          const s=String(v).trim();
          if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
          if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){const p=s.split("/");return p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");}
          return s;
        }
        // ── Column map matches XLSX template exactly (0-based) ──────
        // A=0(#) B=1(Name) C=2(From Page) D=3(To Page) E=4(Total Full Sides)
        // F=5(Additional Lines) G=6(Absences) H=7(Para Dor Mornings)
        // I=8(Total Lines-CALC) J=9(Sabaq Days-CALC) K=10(Average-CALC)
        // L=11(Class) M=12(Report Start Date) N=13(Report End Date) O=14(Total Days Of Sabaq) P=15(Target Given)
        // Q=16(Total Lines Target-CALC) R=17(Upcoming Target)
        // S=18(True Avg-CALC) T=19(Adjusted Lines-CALC)
        // U=20(Champion Total Sides-CALC) V=21(Champion Daily Avg-CALC)
        // W=22(Behaviour) X=23(Teacher Comments)
        // Calculated columns (I,J,K,Q,S,T,U,V) are SKIPPED — app recalculates
        const C={
          name:1, fromPage:2, toPage:3, totalFullSides:4, plusLines:5,
          absences:6, paraDorMornings:7,
          // I(8)=Total Lines CALC — skip
          // J(9)=Sabaq Days CALC — skip
          // K(10)=Average CALC — skip
          class:11, dateFrom:12, dateTo:13, totalDaysOfSabaq:14, targetGiven:15,
          // Q(16)=Total Lines Target CALC — skip
          upcomingTarget:17,
          // S(18)=True Average CALC — skip
          // T(19)=Adjusted Lines CALC — skip
          // U(20)=Champion Total Sides CALC — skip
          // V(21)=Champion Daily Avg CALC — skip
          behaviour:22, teacherComments:23
        };
        const newRecs=[];
        for(let ri=0;ri<rows.length;ri++){
          const r=rows[ri];
          const name=String(r[C.name]||"").trim();
          if(!name||name.toLowerCase()==="name"||name.toLowerCase()==="#"||name.startsWith("NOTES")||name.startsWith("GREEN")||name.startsWith("Legend")||name.startsWith("SOURCE"))continue;
          const rec=Object.assign({},defaultEntry,{id:uid()});
          rec.name=name;
          rec.fromPage=cleanNum(r[C.fromPage]);
          rec.toPage=cleanNum(r[C.toPage]);
          rec.totalFullSides=cleanNum(r[C.totalFullSides]);
          rec.plusLines=cleanNum(r[C.plusLines]);
          rec.absences=cleanNum(r[C.absences]);
          rec.paraDorMornings=cleanNum(r[C.paraDorMornings]);
          rec.class=String(r[C.class]||"").trim()||"HIFZ CLASS A";
          if(!CLASSES.includes(rec.class))rec.class=CLASSES[0];
          rec.dateFrom=cleanDate(r[C.dateFrom]);
          rec.dateTo=cleanDate(r[C.dateTo]);
          if(!rec.dateTo)rec.dateTo=rec.dateFrom;
          rec.totalDaysOfSabaq=cleanNum(r[C.totalDaysOfSabaq]);
          rec.targetGiven=cleanNum(r[C.targetGiven])||"13";
          rec.upcomingTarget=cleanNum(r[C.upcomingTarget])||"13";
          rec.behaviour=cleanNum(r[C.behaviour])||"5";
          rec.teacherComments=String(r[C.teacherComments]||"").trim();
          if(rec.name){
            // I2: run through sanitiseRecord to enforce all validation rules
            rec.id=uid();
            var _san=sanitiseRecord(rec);
            if(_san)newRecs.push(_san);
          }
        }
        if(!newRecs.length){showToast("âŒ No valid records found. Check Name column (B) is filled and file matches the XLSX template.","error");return;}
        // I3: within-batch dedup by name+month before pushing to store
        var _batchSeen={};
        var _batchUnique=newRecs.filter(function(rec){
          var _key=rec.name+"||"+(rec.dateFrom?rec.dateFrom.substring(0,7):"");
          if(_batchSeen[_key])return false;
          _batchSeen[_key]=true;return true;
        });
        var _batchDupCount=newRecs.length-_batchUnique.length;
        setRecords(function(prev){
          var added=0,skipped=0;const next=[...prev];
          _batchUnique.forEach(function(rec){
            const m=rec.dateFrom?rec.dateFrom.substring(0,7):"";
            const dup=m&&next.some(function(r2){return r2.name===rec.name&&r2.dateFrom&&r2.dateFrom.substring(0,7)===m;});
            if(!dup){next.push(rec);added++;}else{skipped++;}
            // Auto-create student profile anchor if one doesn't exist yet
            var hasProfile=next.some(function(r2){return r2.name===rec.name&&r2.isStudentProfile;});
            if(!hasProfile){
              next.push(Object.assign({},defaultEntry,{
                id:uid(),name:rec.name,class:rec.class,
                dateFrom:rec.dateFrom||"",dateTo:rec.dateFrom||"",
                totalFullSides:"0",plusLines:"0",absences:"0",paraDorMornings:"0",
                totalDaysOfSabaq:"0",targetGiven:13,upcomingTarget:13,behaviour:5,
                weakSabaqInstances:"N/A",weakDorInstances:"N/A",
                eveningPossibleDays:"0",eveningAbsences:"0",
                isStudentProfile:true,
              }));
            }
          });
          lsSave(next);
          var msg="\u2705 Import complete\n\n"
            +"  \u2022 "+added+" record(s) imported\n"
            +(skipped>0?"  \u2022 "+skipped+" skipped (already exist for same student+month)\n":"")
            +(_batchDupCount>0?"  \u2022 "+_batchDupCount+" removed as duplicates within the file\n":"")
            +"\nAll champion calculations applied automatically.";
          showToast(msg.split("\n")[0],"success");
          scheduleSync();
          return next;
        });
      }catch(err){showToast("XLSX import error: "+err.message,"error");}
    };
    reader.readAsArrayBuffer(file);
    e.target.value="";
  }


  function importCSV(e){
    const file=e.target&&e.target.files&&e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onerror=function(){showToast("Could not read the file. Please try again.","error");};
    reader.onload=function(ev){
      try{
        const text=ev.target.result;
        const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(l=>l.trim());
        if(lines.length<2)return;
        function parseCSVLine(line){
          var result=[],current="",inQ=false;
          for(var ci=0;ci<line.length;ci++){
            var ch=line[ci];
            if(ch==='"'){
              if(inQ&&line[ci+1]==='"'){current+='"';ci++;}
              else inQ=!inQ;
            } else if(ch===","&&!inQ){result.push(current.trim());current="";}
            else current+=ch;
          }
          result.push(current.trim());
          return result;
        }
        const headers=parseCSVLine(lines[0]).map(h=>h.replace(/\uFEFF/g,"").trim());
        const newRecs=[];
        for(let i=1;i<lines.length;i++){
          const vals=parseCSVLine(lines[i]);
          if(!vals[0]||!vals[0].trim())continue;
          const rec=Object.assign({},defaultEntry,{id:uid()});
          headers.forEach(function(h,idx){
            const fieldMap={"Name":"name","Class":"class","From Page":"fromPage","To Page":"toPage","Total Full Sides":"totalFullSides","Extra Lines (+)":"plusLines","Absences":"absences","Para Dor Mornings":"paraDorMornings","Total Days of Sabaq":"totalDaysOfSabaq","Date From (DD/MM/YYYY)":"dateFrom","Date To (DD/MM/YYYY)":"dateTo","Target Given (default 13)":"targetGiven","Upcoming Target (default 13)":"upcomingTarget","Father Email":"parentEmail1","Mother Email":"parentEmail2","Evening Possible Days":"eveningPossibleDays","Evening Absences":"eveningAbsences","Weak Sabaq Instances":"weakSabaqInstances","Weak Dor Instances":"weakDorInstances","Teacher Comments":"teacherComments","Behaviour (1-5)":"behaviour"};
            if(fieldMap[h]&&vals[idx]!==undefined)rec[fieldMap[h]]=vals[idx];
          });
          // Convert DD/MM/YYYY to YYYY-MM-DD
          ["dateFrom","dateTo"].forEach(function(f){
            if(rec[f]&&rec[f].includes("/")){
              var p=rec[f].split("/");rec[f]=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");
            }
          });
          // Validate class — default to first valid class if unknown
          if(rec.class&&!CLASSES.includes(rec.class)){
            rec.class=CLASSES[0];
          }
          if(rec.name&&rec.name.trim())newRecs.push(rec);
        }
        if(newRecs.length>0){
          setRecords(function(prev){
            // Deduplicate: skip records with same name+dateFrom month
            var added=0;
            var next=[...prev];
            newRecs.forEach(function(rec){
              var m=rec.dateFrom?rec.dateFrom.substring(0,7):"";
              var dup=m&&next.some(function(r){return r.name===rec.name&&r.dateFrom&&r.dateFrom.substring(0,7)===m;});
              if(!dup){next.push(rec);added++;}
            });
            lsSave(next);
            showToast("Imported "+added+" record(s). "+(newRecs.length-added)+" skipped as duplicates.","success");
            scheduleSync();
            return next;
          });
        }else{
          showToast("No valid records found in CSV.","error");
        }
      }catch(err){showToast("Import error: "+err.message,"error");}
    };
    reader.readAsText(file);
    e.target.value="";
  }

  async function saveEntry(){
    if(!form.name.trim()){showToast("Please enter a student name.","error");return;}
    if(form.name.trim().length>80){showToast("Student name too long — max 80 characters.","error");return;}
    if(!form.dateFrom){showToast("Please enter a Date From.","error");return;}
    if(!form.dateTo){showToast("Please enter a Date To.","error");return;}
    const _dfRe=/^\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])$/;
    if(!_dfRe.test(form.dateFrom)){showToast("Invalid Date From — use YYYY-MM-DD format.","error");return;}
    if(!_dfRe.test(form.dateTo)){showToast("Invalid Date To — use YYYY-MM-DD format.","error");return;}
    if(form.dateFrom>form.dateTo){showToast("Date From must be before Date To.","error");return;}
    // ── Sanitise all numeric fields before saving ──
    function clampInt(v,min,max){var n=parseInt(v)||0;return String(Math.max(min,Math.min(max,n)));}
    function clampFloat(v,min,max){var n=parseFloat(v)||0;return String(Math.max(min,Math.min(max,n)));}
    let savedForm={...form,
      totalFullSides: clampInt(form.totalFullSides,0,9999),
      plusLines: clampInt(form.plusLines,0,12),
      totalDaysOfSabaq: clampInt(form.totalDaysOfSabaq,0,31),
      absences: clampInt(form.absences,0,31),
      paraDorMornings: clampInt(form.paraDorMornings,0,31),
      eveningPossibleDays: clampInt(form.eveningPossibleDays,0,31),
      eveningAbsences: clampInt(form.eveningAbsences,0,31),
      targetGiven: Math.max(1,parseInt(form.targetGiven)||13),
      upcomingTarget: Math.max(1,parseInt(form.upcomingTarget)||13),
      behaviour: Math.max(1,Math.min(5,parseInt(form.behaviour)||5)),
    };
    // Page order validation
    const fp=parseInt(savedForm.fromPage)||0;
    const tp=parseInt(savedForm.toPage)||0;
    if(fp>0&&tp===0){showToast("Please enter the To Page — required when From Page is set.","error");return;}
    if(fp>0&&tp>0&&fp>tp){showToast("From Page ("+fp+") cannot be greater than To Page ("+tp+").","error");return;}
    // Cross-field validation
    const tds=parseInt(savedForm.totalDaysOfSabaq)||0;
    const abs=parseInt(savedForm.absences)||0;
    const pdm=parseInt(savedForm.paraDorMornings)||0;
    if(abs+pdm>tds){
      showToast("Absences ("+abs+") + Para Dor mornings ("+pdm+") cannot exceed Total Days of Sabaq ("+tds+").","error");
      return;
    }
    // Auto-fill emails from previous records if not new student
    if(!addNewStudent&&!editingId){
      const prev=calced.filter(r=>r.name===form.name).sort((a,b)=>(b.dateFrom||"").localeCompare(a.dateFrom||""))[0];
      if(prev&&(prev.parentEmail1||prev.parentEmail2)){
        savedForm.parentEmail1=savedForm.parentEmail1||prev.parentEmail1||"";
        savedForm.parentEmail2=savedForm.parentEmail2||prev.parentEmail2||"";
      }
    }
    if(editingId){
      const exists=records.some(r=>r.id===editingId);
      if(!exists){showToast("This record no longer exists — it may have been deleted on another device.","error");return;}
      setRecords(prev=>prev.map(r=>r.id===editingId?{...savedForm,id:editingId}:r));
    }
    else{
      // Guard: prevent duplicate records for same student+month
      const newMonth=savedForm.dateFrom?savedForm.dateFrom.substring(0,7):"";
      const hasDup=newMonth&&records.some(r=>r.name===savedForm.name&&r.id!==editingId&&r.dateFrom&&r.dateFrom.substring(0,7)===newMonth);
      if(hasDup){const _dup=await showConfirm("A record for "+savedForm.name+" in "+newMonth+" already exists.","Save Duplicate?");if(!_dup)return;}
      setRecords(prev=>[...prev,{...savedForm,id:uid()}]);
    }
    setView("menu");setEditingId(null);setForm(defaultEntry);setAddNewStudent(false);
  }
  async function clearAllData(){

    const _cdok=await showConfirm("This will permanently delete ALL records. This cannot be undone.","⚠️ Delete All Data");if(!_cdok)return;

    if(isSyncing.current){
      await new Promise(resolve=>{
        var t=0;
        var wait=setInterval(()=>{if(!isSyncing.current||t++>20){clearInterval(wait);resolve();}},100);
      });
    }
    // Delete from Supabase
    try{
      await Promise.all([
        sbFetch("sabaq_records?id=neq.null","DELETE"),
        sbFetch("dor_records?id=neq.null","DELETE"),
        sbFetch("daily_sabaq?id=neq.null","DELETE"),
        sbFetch("register_data?id=neq.null","DELETE"),
        sbFetch("year_plan?id=neq.null","DELETE"),
      ]);
    }catch(e){console.error("clearAllData",e);}
    // Clear local state
    setRecords([]);setDorRecords([]);setDailySabaqEntries([]);setRegisterData([]);setYearPlan([]);
    lsSave([]);lsSaveDor([]);lsSaveDailySabaq([]);lsSaveRegister([]);lsSaveYearPlan([]);

  }

    sbFetch("sabaq_records?id=eq."+encodeURIComponent(id),"DELETE").catch(e=>console.warn("deleteRecord",e));

    if(rec){
      const remaining=records.filter(r=>r.id!==id&&r.name===rec.name&&r.class===rec.class);

    const [sR,dR,dlR,rR,pR,stR]=await Promise.all([
      tryLoad(()=>sbFetchAll("sabaq_records?select=*&order=date_from.desc")),
      tryLoad(()=>sbFetchAll("dor_records?select=*&order=date.desc")),
      tryLoad(()=>sbFetchAll("daily_sabaq?select=*&order=date.desc")),
      tryLoad(()=>sbFetchAll("register_data?select=*&order=date.desc")),
      tryLoad(()=>sbFetchAll("year_plan?select=*")),

    ]);
    if(sR.ok&&sR.data.length>0){const d=sR.data.map(sbMapSabaqIn).map(sanitiseRecord).filter(Boolean);setRecords(d);lsSave(d);}
    if(dR.ok&&dR.data.length>0){const d=dR.data.map(sbMapDorIn).map(sanitiseDor).filter(Boolean);setDorRecords(d);lsSaveDor(d);}
    if(dlR.ok&&dlR.data.length>0){const d=dlR.data.map(sbMapDailyIn).map(sanitiseDaily).filter(Boolean);setDailySabaqEntries(d);lsSaveDailySabaq(d);}
    if(rR.ok&&rR.data.length>0){const d=rR.data.map(sbMapRegisterIn).map(sanitiseRegister).filter(Boolean);setRegisterData(d);lsSaveRegister(d);}
    if(pR.ok&&pR.data.length>0){setYearPlan(pR.data);lsSaveYearPlan(pR.data);}
    if(stR.ok){
      const pw=stR.data.find(r=>r.key==="adminPassword");
      if(pw&&pw.value)localStorage.setItem("adminPassword",pw.value);
      const ht=stR.data.find(r=>r.key==="htEmail");
      if(ht&&ht.value!==undefined){setHtEmail(ht.value);lsSaveHT(ht.value);}
    }
    isFirstLoad.current=false;
    setSyncStatus("live");
    // Flush any writes that were blocked by isFirstLoad guard during load
    scheduleSync();
  }

function SabaqEntryPage({studentNames,records,dorRecords,setRecords,setDorRecords,dailySabaqEntries,setDailySabaqEntries,selectedClass,selectedDate,syncNow,yearPlan,registerData}){
  const today=getTodayStr();

  const _studentsByClass=React.useMemo(()=>{
    const m={};
    records.forEach(r=>{if(r.class&&r.name&&!r.name.startsWith("(")){
      if(!m[r.class])m[r.class]=new Set(); m[r.class].add(r.name);
    }});
    return m;
  },[records]);
  function getClassStudents(c){return [...(_studentsByClass[c]||new Set())].sort();}

  const EMPTY_AM=name=>({
    name,absent:false,
    spMistakes:"",spScrape:false,spKaccha:false,
    sp2Done:false,sp2Mistakes:"",sp2Scrape:false,sp2Kaccha:false,
    sabaqLines:"",sabaqWeak:false,sabaqLessLines:false,
    dorDone:false,dorJuz:"",dorQuarter:"",dorMistakes:"",dorKaccha:false,dorScrape:false,dorNoTime:false,dorParaDor:false,
  });
  function bufFromSaved(sv){
    const base=EMPTY_AM(sv.studentName);
    if(sv.absent)return{...base,absent:true};
    return{...base,absent:false,
      spMistakes:(sv.spMistakes!==undefined&&sv.spMistakes!==null)?String(sv.spMistakes):"",
      spScrape:!!sv.spScrape,spKaccha:!!sv.spKaccha2,
      sp2Done:!!sv.sp2Done,sp2Mistakes:sv.sp2Done?String(sv.sp2Mistakes||0):"",
      sp2Scrape:!!sv.sp2Scrape,sp2Kaccha:!!sv.sp2Kaccha,
      sabaqLines:sv.sabaqLines?String(sv.sabaqLines):"",
      sabaqWeak:!!sv.sabaqWeak,sabaqLessLines:!!sv.sabaqLessLines,
      dorDone:!!(sv.morningDor!==undefined?sv.morningDor:sv.paraDor),dorJuz:sv.pdJuz||"",dorQuarter:normQuarter(sv.pdQuarter||""),
      dorMistakes:sv.pdMistakes?String(sv.pdMistakes):"",
      dorKaccha:!!(sv.pdKaccha!==undefined?sv.pdKaccha:sv.pdScrape),
      dorScrape:!!(sv.pdKaccha!==undefined&&sv.pdScrape),
      dorNoTime:!!sv.pdNoTime,
      dorParaDor:sv.pdIsParaDor!==undefined?!!sv.pdIsParaDor:!!sv.paraDor};
  }
  function initAM(name){
    const sv=(dailySabaqEntries||[]).find(e=>e.class===cls&&e.date===date&&e.studentName===name);
    if(sv)return bufFromSaved(sv);
    const rk=getRegisterKey(cls,"morning",date);
    const reg=(registerData||[]).find(r=>r.key===rk&&r.studentName===name);
    return{...EMPTY_AM(name),absent:!!(reg&&(reg.status==="A"||reg.status==="AG"))};
  }

  const [cls,setCls]    = React.useState(selectedClass||"HIFZ CLASS A");

function getMonthsForPlanner(startYear, startMonth, count){
  const months=[];
  let y=startYear||new Date().getFullYear();
  let m=startMonth||new Date().getMonth()+1;
  const n=count||12;
  for(let i=0;i<n;i++){
    const d=new Date(y,m-1,1);
    const wkStart=getWeekNumber(d);
    months.push({year:y,month:m,
      label:d.toLocaleString("default",{month:"long"})+" "+y,
      shortLabel:d.toLocaleString("default",{month:"short"}),
      wkStart});
    m++;if(m>12){m=1;y++;}
  }
  return months;
}

function getWeekNumber(d){
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=date.getUTCDay()||7;
  date.setUTCDate(date.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}

function getPlanDates(yearPlan,cls,session){
  const entry=yearPlan.find(p=>p.class===cls&&p.session===session);
  return(entry&&Array.isArray(entry.dates))?entry.dates:[];
}

function setPlanDates(yearPlan,setYearPlan,cls,session,dates){
  // Validate and sanitise dates before storing
  const validDates=dates.filter(function(d){
    return d&&typeof d.year==="number"&&typeof d.month==="number"&&typeof d.day==="number"
      &&d.year>=2020&&d.year<=2040
      &&d.month>=1&&d.month<=12
      &&d.day>=1&&d.day<=31;
  });
  setYearPlan(prev=>{
    const next=prev.filter(p=>!(p.class===cls&&p.session===session));
    next.push({id:cls+"_"+session,class:cls,session,dates:validDates});
    return next;
  });
}

function getHolidayDates(yearPlan){
  const entry=yearPlan.find(p=>p.class==="__holidays__");
  return entry?entry.dates:[];
}

function setHolidayDates(yearPlan,setYearPlan,dates){
  setYearPlan(prev=>{
    const next=prev.filter(p=>p.class!=="__holidays__");
    next.push({id:"__holidays__",class:"__holidays__",session:"",dates});
    return next;
  });
}

function getSpecialDates(yearPlan,type){
  const entry=yearPlan.find(p=>p.class==="__special__"&&p.session===type);
  return entry?entry.dates:[];
}

function setSpecialDates(yearPlan,setYearPlan,type,dates){
  setYearPlan(prev=>{
    const next=prev.filter(p=>!(p.class==="__special__"&&p.session===type));
    next.push({id:"__special__"+type,class:"__special__",session:type,dates});
    return next;
  });
}

function getHolidayRanges(yearPlan){
  const entry=yearPlan.find(p=>p.class==="__holiday_ranges__");
  return entry?entry.dates:[];
}

function setHolidayRanges(yearPlan,setYearPlan,ranges){
  setYearPlan(prev=>{
    const next=prev.filter(p=>p.class!=="__holiday_ranges__");
    next.push({id:"__holiday_ranges__",class:"__holiday_ranges__",session:"",dates:ranges});
    return next;
  });
}

function isDateInRanges(year,month,day,ranges){
  const ts=new Date(year,month-1,day).getTime();
  return ranges.some(r=>{
    if(!r.from||!r.to)return false;
    const from=new Date(r.from).getTime();
    const to=new Date(r.to).getTime();
    return ts>=from&&ts<=to;
  });
}

function formatDateDMYShort(d){
  if(!d)return"";
  const parts=d.split("-");
  if(parts.length!==3)return d;
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}

function getRegisterKey(cls,session,date){return cls+"||"+session+"||"+date;}

// Build O(1) lookup Map: "key||studentName" â†’ entry
function buildRegisterIndex(registerData){
  const m=new Map();
  if(!Array.isArray(registerData))return m;
  registerData.forEach(r=>{ if(r.key&&r.studentName)m.set(r.key+"||"+r.studentName,r); });
  return m;
}

  return entry||{status:"P",minutesLate:0,absenceReason:"",madeUp:false,msgSent:false};
}

// ─── PLANNER CALENDAR VIEW COMPONENT ──────────────────────────
function PlannerCalendarView({yearPlan,months,cls,SPECIAL_TYPES}){
  const DOW=["Su","M","Tu","W","Th","F","S"];

  function getDayType(year,month,day){
    const ranges=getHolidayRanges(yearPlan);
    const holDates=getHolidayDates(yearPlan);
    if(isDateInRanges(year,month,day,ranges))return"holiday";
    if(holDates.some(d=>d.year===year&&d.month===month&&d.day===day))return"holiday";
    for(const st of SPECIAL_TYPES.filter(s=>s.key!=="holiday")){
      const dates=getSpecialDates(yearPlan,st.key);
      if(dates.some(d=>d.year===year&&d.month===month&&d.day===day))return st.key;
    }
    const morn=getPlanDates(yearPlan,cls,"morning");
    if(morn.some(d=>d.year===year&&d.month===month&&d.day===day))return"morning";
    const eve=getPlanDates(yearPlan,cls,"evening");
    if(eve.some(d=>d.year===year&&d.month===month&&d.day===day))return"evening";
    return null;
  }

  const TYPE_COLORS={
    holiday:{bg:"#DC2626",text:"#fff"},
    exam:{bg:"#16a34a",text:"#fff"},
    parents:{bg:"#ca8a04",text:"#fff"},
    boys_jalsa:{bg:"#d97706",text:"#fff"},
    girls_jalsa:{bg:"#7c3aed",text:"#fff"},
    morning:{bg:"#B8934A",text:"#fff"},
    evening:{bg:"#2563eb",text:"#fff"},
  };

  return(
    React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12}},
      months.map((m,mi)=>{
        const firstDay=new Date(m.year,m.month-1,1).getDay();
        const daysInMonth=new Date(m.year,m.month,0).getDate();
        const wkNum=getWeekNumber(new Date(m.year,m.month-1,1));
        const cells=[];
        for(let i=0;i<firstDay;i++)cells.push(null);
        for(let d=1;d<=daysInMonth;d++)cells.push(d);
        while(cells.length%7!==0)cells.push(null);
        return React.createElement('div',{key:mi,style:{background:"#fff",borderRadius:12,border:"1px solid #e5e7eb",overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}},
          /* Month header */
          React.createElement('div',{style:{background:"#1e2d3d",color:"#fff",padding:"8px 12px",fontWeight:"600",fontSize:13,textAlign:"center"}},m.label),
          /* DOW header */
          React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",background:"#F8F9FA",borderBottom:"1px solid #e5e7eb"}},
            DOW.map(d=>React.createElement('div',{key:d,style:{textAlign:"center",fontSize:10,fontWeight:"600",color:"#9CA3AF",padding:"4px 2px"}},d))
          ),
          /* Days */
          React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,padding:4}},
            cells.map((day,ci)=>{
              if(!day)return React.createElement('div',{key:ci});
              const type=getDayType(m.year,m.month,day);
              const tc=type?TYPE_COLORS[type]:null;
              const isSunOrSat=ci%7===0||ci%7===6;
              return React.createElement('div',{key:ci,style:{
                textAlign:"center",fontSize:11,fontWeight:type?"700":"400",
                padding:"3px 2px",borderRadius:4,
                background:tc?tc.bg:isSunOrSat?"#F3F4F6":"transparent",
                color:tc?tc.text:isSunOrSat?"#9CA3AF":"#374151",
              }},day);
            })
          )
        );
      })
    )
  );
}

    if(holDates.some(d=>d.year===year&&d.month===month&&d.day===day))return"holiday";
    for(const st of SPECIAL_TYPES.filter(s=>s.key!=="holiday")){
      const dates=getSpecialDates(yearPlan,st.key);
      if(dates.some(d=>d.year===year&&d.month===month&&d.day===day))return st.key;
    }
    const morn=getPlanDates(yearPlan,cls,"morning");
    if(morn.some(d=>d.year===year&&d.month===month&&d.day===day))return"morning";
    const eve=getPlanDates(yearPlan,cls,"evening");
    if(eve.some(d=>d.year===year&&d.month===month&&d.day===day))return"evening";
    return null;
  }

  function monthHTML(m){
    const firstDay=new Date(m.year,m.month-1,1).getDay();
    const daysInMonth=new Date(m.year,m.month,0).getDate();
    const wkNum=getWeekNumber(new Date(m.year,m.month-1,1));
    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(null);
    for(let d=1;d<=daysInMonth;d++)cells.push(d);
    while(cells.length%7!==0)cells.push(null);
    let html=`<div class="month"><div class="month-hdr">${m.label}</div>`;
    html+=`<table class="cal"><thead><tr><th>Wk</th>${DOW.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>`;
    for(let r=0;r<cells.length/7;r++){
      const weekCells=cells.slice(r*7,r*7+7);
      const firstDate=weekCells.find(d=>d);
      const wk=firstDate?getWeekNumber(new Date(m.year,m.month-1,firstDate)):"-";
      html+=`<tr><td class="wk">${wk}</td>`;
      weekCells.forEach((day,ci)=>{
        if(!day){html+=`<td></td>`;return;}
        const type=getDayType(m.year,m.month,day);
        const color=type?TYPE_COLORS[type]:"";
        const isSunSat=ci===0||ci===6;
        const bg=color?color:isSunSat?"#e5e7eb":"#fff";
        const tc=color?"#fff":isSunSat?"#9CA3AF":"#1a1f2e";
        html+=`<td style="background:${bg};color:${tc};font-weight:${color?"700":"400"}">${day}</td>`;
      });
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
    return html;
  }

  const legend=SPECIAL_TYPES.map(st=>`<div class="leg-item"><div class="leg-dot" style="background:${TYPE_COLORS[st.key]||"#ddd"}"></div>${st.label}</div>`).join("")
    +`<div class="leg-item"><div class="leg-dot" style="background:#B8934A"></div>Morning Session</div>`
    +`<div class="leg-item"><div class="leg-dot" style="background:#2563eb"></div>Evening Session</div>`;

  return`<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@page{size:A4 landscape;margin:10mm;}
body{font-family:Arial,sans-serif;font-size:11px;margin:0;color:#1a1f2e;}
.title{text-align:center;font-size:16px;font-weight:700;margin-bottom:12px;color:#1e2d3d;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.month{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;}
.month-hdr{background:#1e2d3d;color:#fff;text-align:center;font-weight:700;padding:6px;font-size:12px;}
.cal{width:100%;border-collapse:collapse;}
.cal th{background:#374151;color:#94a3b8;padding:3px 2px;text-align:center;font-size:9px;font-weight:600;}
.cal td{text-align:center;padding:3px 2px;border:1px solid #f3f4f6;font-size:10px;border-radius:2px;}
.cal td.wk{color:#9CA3AF;font-size:9px;font-weight:600;background:#F8F9FA;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding:8px 12px;background:#F8F9FA;border-radius:8px;align-items:center;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;}
.leg-dot{width:12px;height:12px;border-radius:2px;}
h2{text-align:center;color:#1e2d3d;margin:0 0 10px;}
</style></head><body>
<h2>Madrasah Al-Ihsaan — Hifz Year Planner (${cls})</h2>
<div class="grid">${months.map(m=>monthHTML(m)).join("")}</div>
<div class="legend">${legend}</div>
</body></html>`;
}

// MONTHLY COLLATION ENGINE
// Reads daily sabaq entries + register data for a student/month
// Returns a pre-filled record matching defaultEntry shape
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function collateMonthlyRecord(studentName, cls, yearMonth, dailySabaqEntries, registerData, existingRecords, dateFrom, dateTo){
  // yearMonth = "YYYY-MM" (used for month-based filter when dateFrom/dateTo not provided)
  // dateFrom / dateTo = "YYYY-MM-DD" for custom range
  const LINES_PER_SIDE = 13;
  const useRange = !!(dateFrom && dateTo);

  // ── 1. Get all daily entries for this student/class/period ──
  const dailies = (dailySabaqEntries||[]).filter(e=>{
    if(!e.studentName===studentName||e.class!==cls||!e.date)return false;
    if(e.studentName!==studentName)return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  });

  if(dailies.length===0){
    return null; // No daily data for this period
  }

  // ── 2. Compute from daily entries ──
  const presentDays = dailies.filter(e=>!e.absent);
  const absentDays  = dailies.filter(e=>e.absent);

  // Days where Para Dor was done (morning replaced by Para Dor)
  const paraDorMornings = presentDays.filter(e=>e.paraDor).length;

  // Sabaq Para days (present and recited sabaq)
  const sabaqParaDays = presentDays.filter(e=>e.sabaqPara&&!e.paraDor);

  // Total days that count as "sabaq days" = present & sabaqPara & not paraDor
  const totalDaysOfSabaq = sabaqParaDays.length;

  // Sabaq (new lesson) lines — from sabaqLines field
  const totalLines = presentDays
    .filter(e=>e.sabaqPara&&!e.paraDor)
    .reduce((sum,e)=>sum+(parseFloat(e.sabaqLines)||parseFloat(e.spLines)||0), 0);

  // Total full sides = floor(totalLines / LINES_PER_SIDE)
  const totalFullSides = Math.floor(totalLines / LINES_PER_SIDE);
  // Plus lines = remainder
  const plusLines = Math.round(totalLines % LINES_PER_SIDE);

  // ── Quality metrics from daily entries ──
  // Sabaq Para mistakes
  const spDays = presentDays.filter(e=>e.sabaqPara&&!e.paraDor);
  const spMistakesTotal = spDays.reduce((s,e)=>s+(parseFloat(e.spMistakes)||0),0);
  const avgSpMistakes = spDays.length>0 ? Math.round(spMistakesTotal/spDays.length*10)/10 : 0;
  // Sabaq Para scrape/kaccha counts
  const spScrapeCount = spDays.filter(e=>e.spScrape).length;
  const spKacchaCount = spDays.filter(e=>e.spKaccha2||e.spKaccha).length;
  // 2nd attempt counts
  const sp2Count = spDays.filter(e=>e.sp2Done).length;
  const sp2ScrapeCount = spDays.filter(e=>e.sp2Done&&e.sp2Scrape).length;
  const sp2KacchaCount = spDays.filter(e=>e.sp2Done&&e.sp2Kaccha).length;
  // Sabaq quality
  const sabaqWeakCount = presentDays.filter(e=>e.sabaqWeak).length;
  const sabaqLessLinesCount = presentDays.filter(e=>e.sabaqLessLines).length;

  // Absences from register (more reliable than daily entries for absences)
  // Count distinct dates where student was marked A or AG in register
  const regAbsences = (registerData||[]).filter(e=>{
    if(e.studentName!==studentName||e.class!==cls||!e.date)return false;
    if(!(e.status==="A"||e.status==="AG"))return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  });
  // Deduplicate by distinct DATE (avoid double-counting morning+evening absences)
  const regAbsentDates = [...new Set(regAbsences.map(e=>e.date))];
  const absences = regAbsentDates.length > 0 ? regAbsentDates.length : absentDays.length;

  // Evening absences from register
  const eveningRegAbsences = (registerData||[]).filter(e=>{
    if(e.studentName!==studentName||e.class!==cls||e.session!=="evening"||!e.date)return false;
    if(!(e.status==="A"||e.status==="AG"))return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  }).length;

  // Evening possible days from register (distinct evening session dates)
  const eveningPossibleDays = [...new Set((registerData||[]).filter(e=>{
    if(e.class!==cls||e.session!=="evening"||!e.date)return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  }).map(e=>e.date))].length;

  // ── 3. Date range from daily entries ──
  const sortedDates = dailies.map(e=>e.date).sort();
  const recDateFrom = sortedDates[0] || (useRange ? dateFrom : yearMonth+"-01");
  const recDateTo   = sortedDates[sortedDates.length-1] || recDateFrom;

  // ── 4. Pull contact info from most recent existing record ──
  const prevRecords = (existingRecords||[])
    .filter(r=>r.name===studentName && r.class===cls)
    .sort((a,b)=>(b.dateFrom||"").localeCompare(a.dateFrom||""));
  const prevRec = prevRecords[0] || {};

  // ── 5. Determine sensible upcomingTarget ──
  // If average >= 11, keep target at 13. Below 10 drop to 10.
  const avg = totalDaysOfSabaq > 0 ? totalLines / totalDaysOfSabaq : 0;
  const upcomingTarget = avg >= 11 ? 13 : avg >= 8 ? 11 : 10;

  // Auto-calculate toPage from fromPage + lines covered
  const fromPageNum = parseInt(prevRec.toPage||0)||0;
  // Each full side = 1 page (both sides of a leaf = 2 pages)
  // A Quran page has 15 lines typically but we use 13 per side
  // totalFullSides / 2 = full leaves. Each leaf = 2 pages.
  const pagesFromLines = Math.floor(totalFullSides / 2);
  const autoToPage = fromPageNum > 0 ? fromPageNum + pagesFromLines : "";

  // Missing data check — which dates in the range had no entries?
  const coveredDates = new Set(dailies.map(e=>e.date));
  let missingDates = [];
  if(useRange){
    const cur = new Date(dateFrom);
    const end = new Date(dateTo);
    while(cur<=end){
      const ds = cur.toISOString().slice(0,10);
      const dow = cur.getDay();
      // Only flag weekdays (Mon-Fri) as potentially missing
      if(dow!==0&&dow!==6&&!coveredDates.has(ds)) missingDates.push(ds);
      cur.setDate(cur.getDate()+1);
    }
    // Limit to first 5 to keep report readable
    if(missingDates.length>5) missingDates = [missingDates[0]+"...and "+(missingDates.length-1)+" more"];
  }

  return {
    id:"",
    name: studentName,
    class: cls,
    fromPage:  fromPageNum > 0 ? String(fromPageNum) : "",
    toPage:    autoToPage ? String(autoToPage) : "",
    totalFullSides: String(totalFullSides),
    plusLines:      String(plusLines),
    absences:       String(absences),
    paraDorMornings: String(paraDorMornings),
    totalDaysOfSabaq: String(totalDaysOfSabaq),
    dateFrom: recDateFrom,
    dateTo:   recDateTo,
    targetGiven:    prevRec.upcomingTarget || 13,
    upcomingTarget,
    parentEmail1:   prevRec.parentEmail1 || "",
    parentEmail2:   prevRec.parentEmail2 || "",
    fatherPhone:    prevRec.fatherPhone  || "",
    motherPhone:    prevRec.motherPhone  || "",
    weakSabaqInstances: sabaqWeakCount>0 ? String(sabaqWeakCount) : "0",
    weakDorInstances:   "N/A",
    avgSpMistakes:      String(avgSpMistakes),
    spScrapeCount:      String(spScrapeCount),
    spKacchaCount:      String(spKacchaCount),
    sp2Count:           String(sp2Count),
    sp2ScrapeCount:     String(sp2ScrapeCount),
    sp2KacchaCount:     String(sp2KacchaCount),
    sabaqLessLinesCount:String(sabaqLessLinesCount),
    teacherComments: "",   // Teacher fills in
    behaviour:       prevRec.behaviour || 5,
    eveningPossibleDays: String(eveningPossibleDays||""),
    eveningAbsences:     String(eveningRegAbsences||""),
    // Metadata for display in the form
    _collated: true,
    _dailyCount: dailies.length,
    _presentCount: presentDays.length,
    _totalLines: totalLines,
    _avgLines: totalDaysOfSabaq > 0 ? Math.round(totalLines/totalDaysOfSabaq*10)/10 : 0,
    _missingDates: missingDates,
    _fromPage: fromPageNum,
    _autoToPage: autoToPage,
  };
}

// Get list of months that have daily sabaq data for a student
function getCollationMonths(studentName, cls, dailySabaqEntries){
  if(!studentName||!cls)return[];
  const months = [...new Set(
    (dailySabaqEntries||[])
      .filter(e=>e.studentName===studentName && e.class===cls && e.date)
      .map(e=>e.date.substring(0,7))
  )].sort().reverse();
  return months;
}


function exportCSV(data,fields,filename){
  if(!data||data.length===0){showToast("No data to export.","warning");return;}
  function escVal(v){
    if(v===null||v===undefined)return"";
    var s=String(v).replace(/"/g,"\"\"");
    if(s.indexOf(",")>=0||s.indexOf("\n")>=0||s.indexOf("\"")>=0)s="\""+s+"\"";
    return s;
  }
  var header=fields.join(",");
  var rows=data.map(function(r){return fields.map(function(f){return escVal(r[f]);}).join(",");});
  var csv="\uFEFF"+header+"\n"+rows.join("\n");
  try{
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download=filename+"_"+getTodayStr()+".csv";
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},100);
  }catch(e){showToast("Export failed: "+e.message,"error");}
}
function exportAllReports(records,dorRecords,calced){

function LineChart({data,color}){
  if(!data||data.length===0)return React.createElement("div",{style:{color:"#6b7280",fontSize:12,textAlign:"center",padding:20}},"No data yet");
  const vals=data.map(function(d){return d.value||0;});
  const maxV=Math.max.apply(null,vals)||1;
  const minV=Math.min.apply(null,vals)||0;
  const W=300,H=80,PAD=10;
  const pts=data.map(function(d,i){
    const x=PAD+(i/(Math.max(data.length-1,1)))*(W-PAD*2);
    const y=H-PAD-((d.value-minV)/(maxV-minV||1))*(H-PAD*2);
    return x+","+y;
  }).join(" ");
  return React.createElement("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:H}},
    React.createElement("polyline",{points:pts,fill:"none",stroke:color||"#B8934A",strokeWidth:"2",strokeLinejoin:"round",strokeLinecap:"round"}),
    data.length>0&&(()=>{ const lastPt=(pts.split(" ").filter(Boolean).pop()||"0,0").split(","); return React.createElement("circle",{cx:lastPt[0]||0,cy:lastPt[1]||0,r:"3",fill:color||"#B8934A"}); })()
  );
}


// ── Error Boundary ─────────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){console.error("App crashed:",error,info&&info.componentStack);}
  render(){
    if(this.state.hasError){
      return React.createElement("div",{
        style:{padding:32,textAlign:"center",fontFamily:"Inter,sans-serif",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#F8F9FA"}
      },
        React.createElement("div",{style:{fontSize:40,marginBottom:16}},"\u26A0\uFE0F"),
        React.createElement("div",{style:{fontWeight:700,fontSize:20,marginBottom:8,color:"#B8934A"}},"Something went wrong"),
        React.createElement("div",{style:{color:"#6b7280",fontSize:14,marginBottom:24,maxWidth:400}},
          "The app encountered an unexpected error. Your data is safe."
        ),
        React.createElement("button",{
          onClick:()=>this.setState({hasError:false,error:null}),
          style:{background:"#B8934A",color:"#fff",border:"none",borderRadius:10,padding:"12px 28px",cursor:"pointer",fontWeight:600,fontSize:15,marginRight:12}
        },"Try Again"),
        React.createElement("button",{
          onClick:()=>window.location.reload(),
          style:{background:"transparent",color:"#6b7280",border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 28px",cursor:"pointer",fontWeight:600,fontSize:15}
        },"Reload App"),
        this.state.error&&React.createElement("details",{style:{marginTop:20,maxWidth:500,textAlign:"left",color:"#9ca3af",fontSize:11}},
          React.createElement("summary",{style:{cursor:"pointer"}},"Technical details"),
          React.createElement("pre",{style:{marginTop:8,whiteSpace:"pre-wrap",wordBreak:"break-all"}},String(this.state.error))
        )
      );
    }
    return this.props.children;
  }
}
