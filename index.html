async function sbFetch(path,method,body){
  const h={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+(await sbGetToken()),"Content-Type":"application/json"};
  if(method==="POST"||method==="PATCH")h["Prefer"]="resolution=merge-duplicates,return=minimal";
  if(method==="DELETE")h["Prefer"]="return=minimal";
  const opts={method:method||"GET",headers:h};
  if(body)opts.body=JSON.stringify(body);
  var _ctrl=new AbortController();
  // Give writes (POST/PATCH) 30 s — large upserts returning minimal data still need time on slow connections
  var _sbT=setTimeout(function(){_ctrl.abort();},(method==="POST"||method==="PATCH")?30000:10000);
  opts.signal=_ctrl.signal;
  var r;
  try{r=await fetch(SUPABASE_URL+"/rest/v1/"+path,opts);}finally{clearTimeout(_sbT);}
  if(!r.ok){
    const e=typeof r.text==="function"?await r.text().catch(()=>""):String(r.status||"error");
    throw new Error(r.status+": "+e.substring(0,100));
  }
  if(r.status===204)return [];
  try{return await r.json();}catch(e){throw new Error("Invalid JSON response from server");}
}
async function sbUpsert(table,rows,conflictCol="id"){

async function sbFetchAll(q){
  // Max 100 pages (100k rows) — sufficient for 5+ years of register data
  let all=[],offset=0,maxPages=100;
  while(maxPages-->0){
    const sep=q.includes("?")?"&":"?";
    const rows=await sbFetch(q+sep+"limit=1000&offset="+offset,"GET");
    if(!Array.isArray(rows))break;
    all=[...all,...rows];
    if(rows.length<1000)break;
    offset+=1000;
  }
  return all;
}

// Replaces all alert() / confirm() / prompt() browser dialogs

// ── Global toast state (imperative API via module-level ref) ──
var _toastQueue=[];
var _toastSetState=null;

function showToast(msg,type,duration){
  type=type||"info"; duration=duration||3200;
  if(_toastSetState){
    _toastSetState(function(prev){
      var id=Date.now()+Math.random();
      setTimeout(function(){
        if(_toastSetState)_toastSetState(function(q){return q.filter(function(t){return t.id!==id;});});
      },duration);
      return[...prev,{id:id,msg:msg,type:type}];
    });
  }
}

function Toast(){
  var pair=React.useState([]);
  var toasts=pair[0],setToasts=pair[1];
  _toastSetState=setToasts;
  if(!toasts.length)return null;
  var STYLES={
    success:{bg:"#07150e",border:"rgba(201,165,83,0.4)",icon:"✓",ic:"#c9a553"},
    error:{bg:"#1a0505",border:"rgba(220,38,38,0.45)",icon:"✕",ic:"#f87171"},
    warning:{bg:"#120c01",border:"rgba(217,119,6,0.45)",icon:"!",ic:"#fbbf24"},
    info:{bg:"#07150e",border:"rgba(201,165,83,0.28)",icon:"i",ic:"#c9a553"},
  };
  return React.createElement("div",{
    style:{position:"fixed",bottom:"calc(env(safe-area-inset-bottom,0px) + 88px)",
      left:16,right:16,zIndex:9000,display:"flex",flexDirection:"column",gap:8,
      alignItems:"center",pointerEvents:"none"}
  },
    toasts.map(function(t){
      var s=STYLES[t.type]||STYLES.info;
      return React.createElement("div",{key:t.id,
        style:{background:s.bg,color:"#f7f4ec",padding:"13px 18px",borderRadius:16,
          maxWidth:520,width:"100%",fontSize:13,fontWeight:"600",
          border:"1px solid "+s.border,
          boxShadow:"0 12px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(201,165,83,0.08)",
          display:"flex",alignItems:"center",gap:12,
          animation:"hl-in 0.28s cubic-bezier(0.2,0.8,0.3,1) both",pointerEvents:"auto"}
      },
        React.createElement("span",{style:{fontSize:13,fontWeight:"800",color:s.ic,
          fontFamily:"Manrope,sans-serif",flexShrink:0,width:18,textAlign:"center"}},s.icon),
        React.createElement("span",{style:{flex:1,lineHeight:1.5,fontFamily:"Manrope,sans-serif"}},t.msg)
      );
    })
  );
}

// ── ConfirmModal ──────────────────────────────────────────────
var _confirmResolve=null;
var _confirmSetState=null;

function showConfirm(message,title){
  return new Promise(function(resolve){
    _confirmResolve=resolve;
    if(_confirmSetState)_confirmSetState({open:true,message:message,title:title||"Confirm"});
  });
}

function ConfirmModal(){
  var pair=React.useState({open:false,message:"",title:"Confirm"});
  var state=pair[0],setState=pair[1];
  _confirmSetState=setState;
  if(!state.open)return null;
  function respond(yes){
    setState({open:false,message:"",title:"Confirm"});
    if(_confirmResolve){_confirmResolve(yes);_confirmResolve=null;}
  }
  return React.createElement("div",{
    style:{position:"fixed",inset:0,background:"rgba(5,14,9,0.65)",backdropFilter:"blur(6px)",
      WebkitBackdropFilter:"blur(6px)",zIndex:8000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}
  },
    React.createElement("div",{
      style:{background:"#fff",borderRadius:26,padding:28,maxWidth:420,width:"100%",
        boxShadow:"0 30px 90px rgba(0,0,0,0.3)",border:"1px solid rgba(201,165,83,0.18)"}
    },
      React.createElement("div",{style:{color:"#1a1f2e",fontWeight:"700",fontSize:17,marginBottom:12}},
        state.title),
      React.createElement("div",{style:{color:"#6b7280",fontSize:14,lineHeight:1.6,marginBottom:24,whiteSpace:"pre-wrap"}},
        state.message),
      React.createElement("div",{style:{display:"flex",gap:12,justifyContent:"flex-end"}},
        React.createElement("button",{
          onClick:function(){respond(false);},
          style:{background:"transparent",border:"1.5px solid #cfc7b2",
            borderRadius:100,padding:"11px 24px",cursor:"pointer",fontSize:13,
            color:"#6d7a6e",fontWeight:"700",letterSpacing:"0.04em"}
        },"Cancel"),
        React.createElement("button",{
          onClick:function(){respond(true);},
          style:{background:"linear-gradient(180deg,#bb463b,#ad3a30)",border:"none",
            borderRadius:100,padding:"11px 24px",cursor:"pointer",fontSize:13,
            color:"#fff",fontWeight:"800",letterSpacing:"0.04em",
            boxShadow:"0 8px 22px rgba(173,58,48,0.3)"}
        },"Confirm")
      )
    )
  );
}

var _inputResolve=null;

function showInputModal(message,options){
  // options: {title, type, choices}
  // type "select": renders a list of choices, returns the chosen value

  return new Promise(function(resolve){
    _inputResolve=resolve;
    if(_inputSetState)_inputSetState({open:true,message:message,
      title:options.title||"Select",type:options.type||"text",
      choices:options.choices||[],value:""});
  });
}

function normQuarter(q){const s=String(q||"").trim();if(/^q[1-4]$/i.test(s))return s.slice(1);return s;}
function heatQuarter(q){let s=normQuarter(q);if(s==="1st Half"||s==="1H")return"1";if(s==="2nd Half"||s==="2H")return"3";return /^[1-4]$/.test(s)?s:null;}
function buildHeatmap(dorRecords,studentName,dateFrom,dateTo){
  if(!Array.isArray(dorRecords))return{};
  const entries=dorRecords.filter(d=>
    d.studentName===studentName&&
    (!dateFrom||d.date>=dateFrom)&&
    (!dateTo||d.date<=dateTo)
  );
  // Track which juz entries are Para Dor
  const paraDorJuzSet=new Set();
  entries.forEach(e=>{
    if(e.paraDor){
      if(e.dor1Juz)paraDorJuzSet.add(String(e.dor1Juz));
      if(e.dor2Juz)paraDorJuzSet.add(String(e.dor2Juz));
    }
  });
  // Group by juz+quarter+date, pick best (lowest mistakes) per same date
  const byKey={};
  entries.forEach(entry=>{
    [[entry.dor1Juz,entry.dor1Quarter,entry.dor1Mistakes,entry.dor1Repeated],
     [entry.dor2Juz,entry.dor2Quarter,entry.dor2Mistakes,entry.dor2Repeated]
    ].forEach(([juz,q,m,rep])=>{
      if(!juz||!q)return;
      const qn=heatQuarter(q);
      if(!qn)return;
      const noTimeOnly=(m===""||m===undefined||m===null);
      if(noTimeOnly)return;
      const key=juz+"-"+qn+"-"+entry.date;
      const ex=byKey[key];
      if(!ex||parseFloat(m)<parseFloat(ex.mistakes)){
        byKey[key]={juz:String(juz),quarter:qn,mistakes:m,repeated:rep,date:entry.date};
      }
    });
  });
  // Build heatmap: juz -> quarter -> array of colors
  const heatmap={};
  Object.values(byKey).forEach(({juz,quarter,mistakes,repeated})=>{
    if(!heatmap[juz])heatmap[juz]={};
    if(!heatmap[juz][quarter])heatmap[juz][quarter]=[];
    const color=getDorColor(mistakes,repeated);
    if(color)heatmap[juz][quarter].push(color);
  });
  heatmap._paraDorJuz=paraDorJuzSet;
  return heatmap;
}

function calcDorTotals(heatmap){
  if(!heatmap||typeof heatmap!=="object")return{completeJuz:0,remainingQ:0,totalMistakes:0};
  let completeJuz=0,remainingQ=0;
  Object.keys(heatmap).filter(k=>!isNaN(Number(k))&&Number(k)>0).forEach(juz=>{
    const done=[1,2,3,4].filter(q=>heatmap[juz]&&heatmap[juz][q]&&heatmap[juz][q].length>0).length;
    if(done===4)completeJuz++;
    else remainingQ+=done;
  });
  return{completeJuz,remainingQ};
}

// ── SHA-256 password hashing (crypto.subtle) ──────────────────
// Replaces btoa() encoding. Async; callers that need sync result
// use the cached stored value only for comparison.
async function _hashPwdAsync(p){
  const enc=new TextEncoder();
  const data=enc.encode(String(p)+"_alhsaan_hifz");
  const buf=await crypto.subtle.digest("SHA-256",data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Synchronous check: compares already-stored hash against hash of input.
// Both sides are SHA-256 hex strings stored in localStorage.
function getAdminPassword(){
  try{return localStorage.getItem("adminPassword")||"";}
  catch(e){return"";}
}
async function setAdminPassword(p){
  const h=await _hashPwdAsync(p);
  try{localStorage.setItem("adminPassword",h);}catch(e){}
  sbUpsert("app_settings",[{key:"adminPassword",value:h,updated_at:new Date().toISOString()}]).catch(()=>{});
}
async function checkAdminPassword(p){
  const stored=getAdminPassword();
  if(!stored)return false;
  const h=await _hashPwdAsync(p);
  // Hash-only — legacy plaintext fallback removed
  return stored===h;
}

// ── DATA SANITISATION ─────────────────────────────────────────
// Called after loading from localStorage or Supabase to fix any corrupt values
function sanitiseRecord(r){
  if(!r||typeof r!=="object")return null;
  if(!r.id||!r.name)return null;
  // V7: blank/invalid class → default to first class
  const _safeClass=CLASSES.includes(r.class)?r.class:CLASSES[0];
  var out={
    ...r,
    class: _safeClass,
    // V1: totalFullSides cap 0-9999
    totalFullSides: String(Math.max(0,Math.min(9999,parseFloat(r.totalFullSides)||0))),
    // plusLines cap 0-12
    plusLines:       String(Math.max(0,Math.min(12,parseInt(r.plusLines)||0))),
    // V2/V3/V4: absences, paraDorMornings, totalDaysOfSabaq — all capped 0-31
    absences:        String(Math.max(0,Math.min(31,parseInt(r.absences)||0))),
    paraDorMornings: String(Math.max(0,Math.min(31,parseInt(r.paraDorMornings)||0))),
    totalDaysOfSabaq:String(Math.max(0,Math.min(31,parseInt(r.totalDaysOfSabaq)||0))),
    // V5/V6: evening attendance caps
    eveningPossibleDays:String(Math.max(0,Math.min(31,parseInt(r.eveningPossibleDays)||0))),
    eveningAbsences: String(Math.max(0,Math.min(31,parseInt(r.eveningAbsences)||0))),
    targetGiven:     Math.max(1,Math.min(50,parseInt(r.targetGiven)||13)),
    upcomingTarget:  Math.max(1,Math.min(50,parseInt(r.upcomingTarget)||13)),
    behaviour:       Math.max(1,Math.min(5,parseInt(r.behaviour)||5)),
    dateFrom:        /^\d{4}-\d{2}-\d{2}$/.test(r.dateFrom||"")?r.dateFrom:"",
    dateTo:          /^\d{4}-\d{2}-\d{2}$/.test(r.dateTo||"")?r.dateTo:"",
    weakSabaqInstances: r.weakSabaqInstances||"N/A",
    weakDorInstances:   r.weakDorInstances||"N/A",
  };
  // V8: cross-field — absences+paraDorMornings must not exceed totalDaysOfSabaq
  var _tds=parseInt(out.totalDaysOfSabaq)||0;
  var _abs=parseInt(out.absences)||0;
  var _pdm=parseInt(out.paraDorMornings)||0;
  if(_abs+_pdm>_tds){out.paraDorMornings=String(Math.max(0,_tds-_abs));}
  return out;
}
function sanitiseDor(r){
  if(!r||typeof r!=="object")return null;

  return{

// HTML escape — every user value written into HTML strings must use this
function esc(v){
  if(v===null||v===undefined)return"";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function calcEntry(s){
  const E=parseFloat(s.totalFullSides)||0,F=parseFloat(s.plusLines)||0;
  const G=parseFloat(s.absences)||0,H=parseFloat(s.paraDorMornings)||0;
  const N=parseFloat(s.totalDaysOfSabaq)||0;
  const O=parseFloat(s.targetGiven)||13,Q=parseFloat(s.upcomingTarget)||13;
  const I=E*13+F;
  const J=Math.max(0,N-H-G); // clamp: sabaq days cannot be negative
  const K=J>0?I/J:0,P=O*13;
  const R=(N-H)>0?I/(N-H):0;
  const S_val=H>0?(I+K*H)/N:(N>0?I/N:0);
  const T=parseFloat((S_val*N/13).toFixed(3));
  const U=parseFloat((S_val/13).toFixed(4));
  // Total possible days = sabaq days attended + absences
  const totalPossibleDays=N+G;
  const totalAttended=N;
  const attendancePct=totalPossibleDays>0?(totalAttended/totalPossibleDays)*100:0;
  const totalAvgPages=I>0?I/13:0;
  let monthName="";
  if(s.dateFrom){try{const d=new Date(s.dateFrom);if(!isNaN(d.getTime()))monthName=d.toLocaleString("default",{month:"long",year:"numeric"});}catch(e){}}
  // ── Sabaq Champion fields (spec v2.4) ──────────────────
  // Step 1: totalLines = I (already computed above)
  // Step 2: sabaqDays
  const sabaqDays = J; // = max(0, N - H - G)
  // Step 3: average lines per sabaq day
  const average = sabaqDays > 0 ? I / sabaqDays : 0;
  // Step 4: trueAverage — absences hurt, Para Dor does NOT
  const trueAverage = (N - H) > 0 ? I / (N - H) : 0;
  // Step 5: adjustedLines — credit Para Dor at student's own trueAverage
  const adjustedLines = I + (trueAverage * H);
  // Step 6: championTotalSides
  const championTotalSides = adjustedLines / 13;
  // Step 7: championDailyAverage — divide by ALL days (Para Dor already credited)
  const championDailyAverage = N > 0 ? championTotalSides / N : 0;
  return{I,J,K,P,R,S:S_val,T,U,O,Q,G,H,N,totalAttended,attendancePct,totalAvgPages,monthName,
    sabaqDays,average,trueAverage,adjustedLines,championTotalSides,championDailyAverage};
}

// Returns true only if the record has enough real data to generate a meaningful report.

}

// Convert a UK-format phone number to the bare digits WhatsApp expects (e.g. 447712345678)
function toWhatsAppNumber(phone){
  if(!phone)return"";
  var n=String(phone).replace(/[\s\-\(\)\+]/g,"");
  if(/^\d{10}$/.test(n)&&n.charAt(0)==="7")return"44"+n;         // 07xxx → 44 7xxx
  if(/^\d{11}$/.test(n)&&n.charAt(0)==="0")return"44"+n.slice(1); // 07xxx (with leading 0) → 44 7xxx
  if(n.startsWith("44"))return n;                                   // already international
  return n;
}

// Generate a PDF blob from a report record.
// onDone(err, blob) — err is null on success.
function generateReportPDF(record, dorRecs, allRecs, onDone){
  if(!hasReportData(record)){onDone(new Error("No data"));return;}
  showToast("Generating PDF… please wait ⏳","info",9000);
  loadPDFLibs(function(){
    try{
      var calc=Object.assign({},record,calcEntry(record));
      var html1=generateReportHTML(record,calc,dorRecs||[],allRecs||[],1);
      var html2=generateReportHTML(record,calc,dorRecs||[],allRecs||[],2);
      renderPageToCanvas(html1,function(err1,canvas1){
        if(err1){onDone(err1);return;}
        renderPageToCanvas(html2,function(err2,canvas2){
          if(err2){onDone(err2);return;}
          try{
            var jsPDF=window.jspdf&&window.jspdf.jsPDF;
            if(!jsPDF)throw new Error("jsPDF not loaded");
            var pdf=new jsPDF({orientation:"portrait",unit:"pt",format:"a4"});
            var pageW=pdf.internal.pageSize.getWidth();
            var pageH=pdf.internal.pageSize.getHeight();
            function addCanvasToPdf(c){
              var imgW=pageW;
              var imgH=(c.height/c.width)*pageW;
              var imgData=c.toDataURL("image/jpeg",0.92);
              if(imgH>pageH){var s=pageH/imgH;pdf.addImage(imgData,"JPEG",0,0,imgW*s,pageH);}
              else{pdf.addImage(imgData,"JPEG",0,0,imgW,imgH);}
            }
            addCanvasToPdf(canvas1);
            pdf.addPage();
            addCanvasToPdf(canvas2);
            onDone(null,pdf.output("blob"));
          }catch(e2){onDone(e2);}
        });
      });
    }catch(e){onDone(e);}
  });
}

function renderPageToCanvas(html,callback){
  var blob=new Blob([html],{type:"text/html;charset=utf-8"});
  var blobUrl=URL.createObjectURL(blob);
  var iframe=document.createElement("iframe");
  iframe.style.cssText="position:fixed;left:-9999px;top:0;width:794px;height:1120px;border:none;";
  document.body.appendChild(iframe);
  iframe.onload=function(){
    setTimeout(function(){
      try{
        var body=iframe.contentDocument&&iframe.contentDocument.body;
        if(!body){throw new Error("iframe body not accessible");}
        window.html2canvas(body,{
          scale:2,useCORS:true,allowTaint:true,logging:false,
          width:794,windowWidth:794
        }).then(function(canvas){
          URL.revokeObjectURL(blobUrl);
          document.body.removeChild(iframe);
          callback(null,canvas);
        }).catch(function(e){
          URL.revokeObjectURL(blobUrl);
          try{document.body.removeChild(iframe);}catch(x){}
          callback(e);
        });
      }catch(e){
        URL.revokeObjectURL(blobUrl);
        try{document.body.removeChild(iframe);}catch(x){}
        callback(e);
      }
    },700);
  };
  iframe.onerror=function(){
    URL.revokeObjectURL(blobUrl);
    try{document.body.removeChild(iframe);}catch(x){}
    callback(new Error("iframe load failed"));
  };
  iframe.src=blobUrl;
}

// Trigger a file download of a blob
function downloadBlob(blob,filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},5000);

function getMonthRange(dateFrom, dateTo){
  if(!dateFrom||!dateTo)return"";
  const d1=new Date(dateFrom), d2=new Date(dateTo);
  if(isNaN(d1.getTime())||isNaN(d2.getTime()))return"";
  const m1=d1.toLocaleString("default",{month:"long"});
  const m2=d2.toLocaleString("default",{month:"long"});
  const y1=d1.getFullYear(), y2=d2.getFullYear();
  if(m1===m2&&y1===y2)return m1+" "+y1;
  if(y1===y2)return m1+"/"+m2+" "+y1;
  return m1+" "+y1+"/"+m2+" "+y2;
}

// DOR ENTRY PAGE

function DorEntryPage({studentNames,dorRecords,setDorRecords,records,yearPlan,registerData,setRegisterData,syncNow}){
  const today=getTodayStr();
  const EV_QUARTERS=[["1","Q1"],["2","Q2"],["3","Q3"],["4","Q4"],["1st Half","1st Half"],["2nd Half","2nd Half"]];
  const EV_MK=[];for(let m=0;m<=10;m+=0.5)EV_MK.push(m);

  const _studentsByClass=React.useMemo(()=>{
    const m={};
    (records||[]).forEach(r=>{if(r.class&&r.name&&!r.name.startsWith("(")){
      if(!m[r.class])m[r.class]=new Set(); m[r.class].add(r.name);
    }});
    return m;
  },[records]);
  function getClassStudents(c){return [...(_studentsByClass[c]||new Set())].sort();}

  const EMPTY_EV=name=>({name,absent:false,
    d1Juz:"",d1Quarter:"",d1Mistakes:"",d1Scrape:false,d1Kaccha:false,d1NoTime:false,d1ParaDor:false,
    d2Juz:"",d2Quarter:"",d2Mistakes:"",d2Scrape:false,d2Kaccha:false,d2NoTime:false,d2Exempt:false,d2ParaDor:false,
    ptOpen:false,ptJuz:"",ptMistakes:"",ptResult:"Passed"});

  function initEV(name,c,d){
    const base=EMPTY_EV(name);
    const sv=(dorRecords||[]).find(e=>e.studentName===name&&e.date===d);
    const rk=getRegisterKey(c,"evening",d);
    const reg=(registerData||[]).find(r=>r.key===rk&&r.studentName===name);
    const absent=!!(reg&&(reg.status==="A"||reg.status==="AG"));
    if(!sv)return{...base,absent};
    return{...base,absent,
      d1Juz:sv.dor1Juz||"",d1Quarter:normQuarter(sv.dor1Quarter||""),
      d1Mistakes:(sv.dor1Mistakes!==undefined&&sv.dor1Mistakes!==null&&sv.dor1Mistakes!=="")?String(sv.dor1Mistakes):"",
      d1Scrape:!!sv.dor1Scrape,d1Kaccha:!!sv.dor1Repeated,d1NoTime:!!sv.dor1NoTime,d1ParaDor:!!sv.paraDor,
      d2Juz:sv.dor2Juz||"",d2Quarter:normQuarter(sv.dor2Quarter||""),
      d2Mistakes:(sv.dor2Mistakes!==undefined&&sv.dor2Mistakes!==null&&sv.dor2Mistakes!=="")?String(sv.dor2Mistakes):"",
      d2Scrape:!!sv.dor2Scrape,d2Kaccha:!!sv.dor2Repeated,d2NoTime:!!sv.dor2NoTime,d2Exempt:!!sv.dor2Exempt,d2ParaDor:!!sv.dor2ParaDor,
      ptOpen:!!sv.paraTest,ptJuz:sv.paraTestJuz||"",ptMistakes:sv.paraTestTotalMistakes||"",ptResult:sv.paraTestResult||"Passed"};
  }

  const [cls,setCls]=React.useState("HIFZ CLASS A");
  const [date,setDate]=React.useState(today);
  const [rows,setRows]=React.useState(()=>getClassStudents("HIFZ CLASS A").map(n=>initEV(n,"HIFZ CLASS A",today)));
  const [queueIdx,setQueueIdx]=React.useState(null);
  const [status,setStatus]=React.useState("");

  React.useEffect(()=>{
    setRows(getClassStudents(cls).map(n=>initEV(n,cls,date)));
    setQueueIdx(null);
  },[cls,date]);

  function updRow(i,f,v){
    const name=rows[i]&&rows[i].name;
    setRows(prev=>{const n=[...prev];n[i]={...n[i],[f]:v};return n;});
    if(f==="absent"&&name&&typeof setRegisterData==="function"){
      const key=getRegisterKey(cls,"evening",date);
      setRegisterData(prev=>{
        const idx=prev.findIndex(r=>r.key===key&&r.studentName===name);
        const cur=idx>=0?prev[idx]:{key,class:cls,session:"evening",date,studentName:name,status:"P",minutesLate:0,absenceReason:"",madeUp:false,msgSent:false};
        const upd={...cur,status:v?"A":"P"};
        let next;
        if(idx>=0){next=[...prev];next[idx]=upd;}else{next=[...prev,upd];}
        lsSaveRegister(next);
        return next;
      });
      scheduleSync();
    }
  }

  function qShort(qv){
    if(!qv)return"";
    if(qv==="1st Half")return"1H";
    if(qv==="2nd Half")return"2H";
    return String(qv).replace(/^Q/i,"");
  }
  function evHasD1(r){return !!(r.d1Juz&&r.d1Quarter&&(r.d1Mistakes!==""||r.d1NoTime));}
  function evHasD2(r){return !r.d2Exempt&&!!(r.d2Juz&&r.d2Quarter&&(r.d2Mistakes!==""||r.d2NoTime));}
  function evHasPT(r){return !!(r.ptOpen&&r.ptJuz&&r.ptResult);}
  function evEntered(r){return r.absent||evHasD1(r)||evHasD2(r)||evHasPT(r)||r.d1ParaDor;}
  function evRowBg(r){
    if(r.absent)return{bg:"#F3F4F6",dim:true};
    if(!evEntered(r))return{bg:"#fff",dim:false};
    if(r.d1Kaccha||r.d2Kaccha)return{bg:"#FEF2F2",dim:false};
    if(r.d1Scrape||r.d2Scrape)return{bg:"#FFF7ED",dim:false};
    if(evHasD1(r)&&(evHasD2(r)||r.d2Exempt))return{bg:"#ECFDF5",dim:false};
    return{bg:"#fff",dim:false};
  }
  function evDot(r){
    if(r.absent)return"#9CA3AF";
    if(!evEntered(r))return"#E5E7EB";
    if(r.d1Kaccha||r.d2Kaccha)return"#EF4444";
    if(r.d1Scrape||r.d2Scrape)return"#F59E0B";

function calcDorChampions(dorRecords, records, dateFrom, dateTo){
  const realRecs=records.filter(r=>!r.isStudentProfile);
  const classA=[...new Set(realRecs.filter(r=>r.class==="HIFZ CLASS A").map(r=>r.name))];
  const classB=[...new Set(realRecs.filter(r=>r.class==="HIFZ CLASS B").map(r=>r.name))];
  const refRecord=records.find(r=>r.dateFrom===dateFrom&&r.dateTo===dateTo);
  const eveningSessions=refRecord?(parseFloat(refRecord.eveningPossibleDays)||0):0;
  const maxQuarters=eveningSessions*2;
  function champForClass(names){
    const studentStats=names.map(name=>{
      const entries=dorRecords.filter(d=>d.studentName===name&&(!dateFrom||d.date>=dateFrom)&&(!dateTo||d.date<=dateTo)&&!d.paraDor);
      const byKey={};
      entries.forEach(entry=>{
        [[entry.dor1Juz,entry.dor1Quarter,entry.dor1Mistakes,entry.dor1Repeated],
         [entry.dor2Juz,entry.dor2Quarter,entry.dor2Mistakes,entry.dor2Repeated]
        ].forEach(([juz,q,m,rep])=>{
          if(!juz||!q||m===""||m===undefined)return;
          const key=juz+"-"+q+"-"+entry.date;
          const ex=byKey[key];
          if(!ex||parseFloat(m)<parseFloat(ex.mistakes))byKey[key]={juz,quarter:q,mistakes:parseFloat(m),repeated:rep,date:entry.date};
        });
      });
      let cleanQuarters=0,totalMistakes=0,hasRedOrRepeat=false;
      Object.values(byKey).forEach(({mistakes,repeated})=>{
        const color=getDorColor(mistakes,repeated);
        if(color==="red")hasRedOrRepeat=true;
        if(repeated)hasRedOrRepeat=true;
        cleanQuarters++;totalMistakes+=mistakes;
      });
      return{name,cleanQuarters,totalMistakes,hasRedOrRepeat};
    }).filter(s=>s.cleanQuarters>0);
    const cleanStudents=studentStats.filter(s=>!s.hasRedOrRepeat);
    let qualifyingQ=0;
    if(cleanStudents.length>0)qualifyingQ=Math.max(...cleanStudents.map(s=>s.cleanQuarters));
    else if(studentStats.length>0)qualifyingQ=Math.max(...studentStats.map(s=>s.cleanQuarters));
    const pool=cleanStudents.length>0?cleanStudents:studentStats;
    const qualifiers=pool.filter(s=>s.cleanQuarters>=qualifyingQ).sort((a,b)=>a.totalMistakes-b.totalMistakes);
    const allRanked=[...studentStats].sort((a,b)=>b.cleanQuarters-a.cleanQuarters||a.totalMistakes-b.totalMistakes);
    return{first:qualifiers[0]||null,second:qualifiers[1]||null,qualifyingQ,maxQ:maxQuarters||qualifyingQ,allRanked};
  }
  return{classA:champForClass(classA),classB:champForClass(classB)};
}

function getAvailablePeriods(records){
  // Group by dateFrom month+year only — ignore exact day and dateTo differences
  // This ensures all students from the same monthly import batch appear as one period
  const seen={};
  (Array.isArray(records)?records:[]).filter(r=>!r.isStudentProfile).forEach(r=>{
    if(!r.dateFrom)return;
    // Key = year-month of dateFrom (e.g. "2026-03")
    const key=r.dateFrom.substring(0,7);
    if(!seen[key]){
      seen[key]={dateFrom:r.dateFrom,dateTo:r.dateTo||r.dateFrom,label:"",key};
    } else {
      if(r.dateFrom<seen[key].dateFrom)seen[key].dateFrom=r.dateFrom;
      if((r.dateTo||r.dateFrom)>seen[key].dateTo)seen[key].dateTo=r.dateTo||r.dateFrom;
    }
  });
  // Build labels after collecting all dates
  const result=Object.values(seen).map(p=>({...p,label:getMonthRange(p.dateFrom,p.dateTo)})).filter(p=>p.label);
  return result.sort((a,b)=>(b.dateFrom||"").localeCompare(a.dateFrom||""));
}

// Match a record to a period - check if its label matches
function recordMatchesPeriod(r,period){
  if(!r.dateFrom||!period)return false;
  // Match by dateFrom month/year key (same as how periods are grouped)
  return r.dateFrom.substring(0,7)===period.dateFrom.substring(0,7);
}

function getLatesForMonth(registerData,month){
  var map={};
  registerData.forEach(function(rec){
    if(!rec.date||!rec.date.startsWith(month))return;
    if(rec.status!=="L")return;
    var mins=Number(rec.minutesLate)||0;
    if(mins<=0)return;
    var key=rec.studentName+"||"+rec.class;
    if(!map[key])map[key]={studentName:rec.studentName,cls:rec.class,totalMinutes:0};
    map[key].totalMinutes+=mins;
  });
  return Object.values(map).sort(function(a,b){return b.totalMinutes-a.totalMinutes;});
}

  function normaliseUKPhone(val){
    // Converts phone values that Excel stripped the leading 0 from back to proper UK format
    var s=String(val||"").trim().replace(/\s+/g," ");
    if(!s)return"";
    var digits=s.replace(/[\s\-\(\)\+]/g,"");
    if(/^\d+$/.test(digits)){
      // 10 digits starting with 7 → mobile number missing leading 0
      if(digits.length===10&&digits.charAt(0)==="7")return"0"+digits;
      // 12 digits starting with 44 → international format missing +
      if(digits.length===12&&digits.startsWith("44"))return"+"+digits;
      // 13 digits starting with 447 → same
      if(digits.length===13&&digits.startsWith("447"))return"+"+digits;
    }
    return s;
  }

  function importCSV(e){
    const file=e.target&&e.target.files&&e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onerror=function(){showToast("Could not read the file. Please try again.","error");};
    reader.onload=function(ev){
      try{
        const text=ev.target.result;
        const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(l=>l.trim());
        if(lines.length<2)return;
        function parseCSVLine(line){
          var result=[],current="",inQ=false;
          for(var ci=0;ci<line.length;ci++){
            var ch=line[ci];
            if(ch==='"'){
              if(inQ&&line[ci+1]==='"'){current+='"';ci++;}
              else inQ=!inQ;
            } else if(ch===","&&!inQ){result.push(current.trim());current="";}
            else current+=ch;
          }
          result.push(current.trim());
          return result;
        }
        const headers=parseCSVLine(lines[0]).map(h=>h.replace(/\uFEFF/g,"").trim());
        const newRecs=[];
        for(let i=1;i<lines.length;i++){
          const vals=parseCSVLine(lines[i]);
          if(!vals[0]||!vals[0].trim())continue;
          const rec=Object.assign({},defaultEntry,{id:uid()});
          headers.forEach(function(h,idx){
            const fieldMap={"Name":"name","Class":"class","From Page":"fromPage","To Page":"toPage","Total Full Sides":"totalFullSides","Extra Lines (+)":"plusLines","Absences":"absences","Para Dor Mornings":"paraDorMornings","Total Days of Sabaq":"totalDaysOfSabaq","Date From (DD/MM/YYYY)":"dateFrom","Date To (DD/MM/YYYY)":"dateTo","Target Given (default 13)":"targetGiven","Upcoming Target (default 13)":"upcomingTarget","Father Email":"parentEmail1","Mother Email":"parentEmail2","Evening Possible Days":"eveningPossibleDays","Evening Absences":"eveningAbsences","Weak Sabaq Instances":"weakSabaqInstances","Weak Dor Instances":"weakDorInstances","Teacher Comments":"teacherComments","Behaviour (1-5)":"behaviour"};
            if(fieldMap[h]&&vals[idx]!==undefined)rec[fieldMap[h]]=vals[idx];
          });
          // Convert DD/MM/YYYY to YYYY-MM-DD
          ["dateFrom","dateTo"].forEach(function(f){
            if(rec[f]&&rec[f].includes("/")){
              var p=rec[f].split("/");rec[f]=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");
            }
          });
          // Validate class — default to first valid class if unknown
          if(rec.class&&!CLASSES.includes(rec.class)){
            rec.class=CLASSES[0];
          }
          if(rec.name&&rec.name.trim())newRecs.push(rec);
        }
        if(newRecs.length>0){
          setRecords(function(prev){
            // Deduplicate: skip records with same name+dateFrom month
            var added=0;
            var next=[...prev];
            newRecs.forEach(function(rec){
              var m=rec.dateFrom?rec.dateFrom.substring(0,7):"";
              var dup=m&&next.some(function(r){return r.name===rec.name&&r.dateFrom&&r.dateFrom.substring(0,7)===m;});
              if(!dup){next.push(rec);added++;}
            });
            lsSave(next);
            showToast("Imported "+added+" record(s). "+(newRecs.length-added)+" skipped as duplicates.","success");
            scheduleSync();
            return next;
          });
        }else{
          showToast("No valid records found in CSV.","error");
        }
      }catch(err){showToast("Import error: "+err.message,"error");}
    };
    reader.readAsText(file);
    e.target.value="";
  }

  function sendReport(record){

    }
    const calc={...record,...calcEntry(record)};
    const reportHTML=generateReportHTML(record,calc,dorRecords,records);

    // 1. Open report in new tab so parent can see/print it
    const blob=new Blob([reportHTML],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const win=window.open(url,'_blank');
    if(win) setTimeout(()=>URL.revokeObjectURL(url),15000);
    else { const w=window.open('','_blank'); if(w){w.document.write(reportHTML);w.document.close();} }

    // 2. Open mailto: with parent emails pre-filled
    const emails=[record.parentEmail1,record.parentEmail2].filter(Boolean);
    if(emails.length>0){
      const monthStr=record.dateFrom?new Date(record.dateFrom).toLocaleString('default',{month:'long',year:'numeric'}):'';
      const subject=encodeURIComponent('Al-Ihsaan Academy — Hifz Report: '+esc(record.name)+(monthStr?' ('+monthStr+')':''));

        'السلام عليكم ورحمة الله وبركاته\n\n'+
        'Dear Parent,\n\n'+
        'Please find attached the Hifz monthly report for '+record.name+'.\n\n'+
        (monthStr?'Month: '+monthStr+'\n\n':'')+
        'The Hifz report is now open in a new tab.\n\nTo attach as PDF: tap the browser menu → Share → Print → Save as PDF, then attach to this email.\n\n'+
        'JazakAllahu Khayran\n'+
        'Al-Ihsaan Academy — Hifz Department'
      );
      // Small delay so the report tab opens first
      setTimeout(()=>{ window.location.href='mailto:'+emails.join(',')+'?subject='+subject+'&body='+body; },400);
    }
  }

  function emailReportPDF(record){
    if(!hasReportData(record)){showToast("No data for "+record.name+" yet — add their pages/days first.","warning",4000);return;}
    // Resolve phone/email from monthly record, falling back to student profile
    var profile=(records||[]).find(function(r){return r.isStudentProfile&&r.name===record.name;});
    var email1=record.parentEmail1||(profile&&profile.parentEmail1)||"";
    var email2=record.parentEmail2||(profile&&profile.parentEmail2)||"";
    var emails=[email1,email2].filter(Boolean);
    var monthStr=record.dateFrom?new Date(record.dateFrom).toLocaleString("default",{month:"long",year:"numeric"}):"";
    var safeName=(record.name||"student").replace(/[^a-zA-Z0-9 _-]/g,"").replace(/\s+/g,"_");
    generateReportPDF(record,dorRecords,records,function(err,pdfBlob){
      if(err){showToast("PDF error: "+err.message,"error");return;}
      // 1. Download the PDF to the user's device
      downloadBlob(pdfBlob,"Report_"+safeName+(monthStr?"_"+monthStr.replace(/\s/g,"_"):"")+".pdf");
      // 2. Open Gmail compose with parent email(s) pre-filled
      var subject=encodeURIComponent("Al-Ihsaan Academy — Hifz Report: "+record.name+(monthStr?" ("+monthStr+")":""));
      var body=encodeURIComponent(
        "السلام عليكم ورحمة الله وبركاته\n\n"+
        "Dear Parent,\n\n"+
        "Please find the Hifz monthly report for "+record.name+" attached.\n\n"+
        (monthStr?"Month: "+monthStr+"\n\n":"")+
        "JazakAllahu Khayran\nAl-Ihsaan Academy — Hifz Department"
      );
      var gmailUrl="https://mail.google.com/mail/?view=cm&fs=1"+
        (emails.length?"&to="+encodeURIComponent(emails.join(",")):"")+"&su="+subject+"&body="+body;
      setTimeout(function(){window.open(gmailUrl,"_blank");},600);
      showToast("✅ PDF saved to Downloads — attach it in the Gmail tab that just opened, then send!","success",7000);
    });
  }

  async function saveEntry(){
    if(!form.name.trim()){showToast("Please enter a student name.","error");return;}
    if(form.name.trim().length>80){showToast("Student name too long — max 80 characters.","error");return;}
    if(!form.dateFrom){showToast("Please enter a Date From.","error");return;}
    if(!form.dateTo){showToast("Please enter a Date To.","error");return;}
    const _dfRe=/^\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])$/;
    if(!_dfRe.test(form.dateFrom)){showToast("Invalid Date From — use YYYY-MM-DD format.","error");return;}
    if(!_dfRe.test(form.dateTo)){showToast("Invalid Date To — use YYYY-MM-DD format.","error");return;}
    if(form.dateFrom>form.dateTo){showToast("Date From must be before Date To.","error");return;}
    // ── Sanitise all numeric fields before saving ──
    function clampInt(v,min,max){var n=parseInt(v)||0;return String(Math.max(min,Math.min(max,n)));}
    function clampFloat(v,min,max){var n=parseFloat(v)||0;return String(Math.max(min,Math.min(max,n)));}
    let savedForm={...form,
      totalFullSides: clampInt(form.totalFullSides,0,9999),
      plusLines: clampInt(form.plusLines,0,12),
      totalDaysOfSabaq: clampInt(form.totalDaysOfSabaq,0,31),
      absences: clampInt(form.absences,0,31),
      paraDorMornings: clampInt(form.paraDorMornings,0,31),
      eveningPossibleDays: clampInt(form.eveningPossibleDays,0,31),
      eveningAbsences: clampInt(form.eveningAbsences,0,31),
      targetGiven: Math.max(1,parseInt(form.targetGiven)||13),
      upcomingTarget: Math.max(1,parseInt(form.upcomingTarget)||13),
      behaviour: Math.max(1,Math.min(5,parseInt(form.behaviour)||5)),
    };
    // Page order validation
    const fp=parseInt(savedForm.fromPage)||0;
    const tp=parseInt(savedForm.toPage)||0;
    if(fp>0&&tp===0){showToast("Please enter the To Page — required when From Page is set.","error");return;}
    if(fp>0&&tp>0&&fp>tp){showToast("From Page ("+fp+") cannot be greater than To Page ("+tp+").","error");return;}
    // Cross-field validation
    const tds=parseInt(savedForm.totalDaysOfSabaq)||0;
    const abs=parseInt(savedForm.absences)||0;
    const pdm=parseInt(savedForm.paraDorMornings)||0;
    if(abs+pdm>tds){
      showToast("Absences ("+abs+") + Para Dor mornings ("+pdm+") cannot exceed Total Days of Sabaq ("+tds+").","error");
      return;
    }
    // Auto-fill emails from previous records if not new student
    if(!addNewStudent&&!editingId){
      const prev=calced.filter(r=>r.name===form.name).sort((a,b)=>(b.dateFrom||"").localeCompare(a.dateFrom||""))[0];
      if(prev&&(prev.parentEmail1||prev.parentEmail2)){
        savedForm.parentEmail1=savedForm.parentEmail1||prev.parentEmail1||"";
        savedForm.parentEmail2=savedForm.parentEmail2||prev.parentEmail2||"";
      }
    }
    if(editingId){
      const exists=records.some(r=>r.id===editingId);
      if(!exists){showToast("This record no longer exists — it may have been deleted on another device.","error");return;}
      setRecords(prev=>prev.map(r=>r.id===editingId?{...savedForm,id:editingId}:r));
    }
    else{
      // Guard: prevent duplicate records for same student+month
      const newMonth=savedForm.dateFrom?savedForm.dateFrom.substring(0,7):"";
      const hasDup=newMonth&&records.some(r=>r.name===savedForm.name&&r.id!==editingId&&r.dateFrom&&r.dateFrom.substring(0,7)===newMonth);
      if(hasDup){const _dup=await showConfirm("A record for "+savedForm.name+" in "+newMonth+" already exists.","Save Duplicate?");if(!_dup)return;}
      setRecords(prev=>[...prev,{...savedForm,id:uid()}]);
    }
    showToast(editingId?"Changes saved":"Entry saved","success");
    setView("menu");setEditingId(null);setForm(defaultEntry);setAddNewStudent(false);
  }
  async function clearAllData(){
    if(!await checkAdminPassword(clearPwd)){showToast("Incorrect password.","error");return;}
    const _cdok=await showConfirm("This will permanently delete ALL records. This cannot be undone.","⚠️ Delete All Data");if(!_cdok)return;
    // Cancel any pending sync to prevent re-upsert after delete
    if(syncTimer.current){clearTimeout(syncTimer.current);syncTimer.current=null;}
    pendingSync.current=false;
    // Wait briefly for any in-flight sync to complete
    if(isSyncing.current){
      await new Promise(resolve=>{
        var t=0;
        var wait=setInterval(()=>{if(!isSyncing.current||t++>20){clearInterval(wait);resolve();}},100);
      });
    }
    // Delete from Supabase
    try{
      await Promise.all([
        sbFetch("sabaq_records?id=neq.null","DELETE"),
        sbFetch("dor_records?id=neq.null","DELETE"),
        sbFetch("daily_sabaq?id=neq.null","DELETE"),
        sbFetch("register_data?id=neq.null","DELETE"),
        sbFetch("year_plan?id=neq.null","DELETE"),
      ]);
    }catch(e){console.error("clearAllData",e);}
    // Clear local state
    setRecords([]);setDorRecords([]);setDailySabaqEntries([]);setRegisterData([]);setYearPlan([]);
    lsSave([]);lsSaveDor([]);lsSaveDailySabaq([]);lsSaveRegister([]);lsSaveYearPlan([]);
    setClearPwd("");setShowClearModal(false);
    showToast("All data cleared.","success");
  }
  async function deleteRecord(id){
    const _drok=await showConfirm("Delete this monthly record?","Delete Record");if(!_drok)return;
    // Find the record to get name+class for orphan cleanup
    const rec=records.find(r=>r.id===id);
    setRecords(prev=>prev.filter(r=>r.id!==id));
    sbFetch("sabaq_records?id=eq."+encodeURIComponent(id),"DELETE").catch(e=>console.warn("deleteRecord",e));
    // If this was the LAST record for this student, clean up related data
    if(rec){
      const remaining=records.filter(r=>r.id!==id&&r.name===rec.name&&r.class===rec.class);
      if(remaining.length===0){
        const _ddc=await showConfirm("This was the last record for "+rec.name+". Also delete their Dor, Daily Sabaq and Register entries?","Remove All Student Data?");if(_ddc){
          setDorRecords(prev=>{const next=prev.filter(d=>d.studentName!==rec.name);lsSaveDor(next);return next;});
          setDailySabaqEntries(prev=>{const next=prev.filter(d=>d.studentName!==rec.name);lsSaveDailySabaq(next);return next;});
          setRegisterData(prev=>{const next=prev.filter(r=>r.studentName!==rec.name);lsSaveRegister(next);return next;});
        }
      }
    }
  }

  async function syncNow(){
    if(isFirstLoad.current)return;
    if(isSyncing.current){pendingSync.current=true;return;} // queue if already syncing
    isSyncing.current=true;
    setSyncStatus("saving");
    try{
      const planRows=yearPlan.map(p=>({id:p.id||(p.class+"_"+p.session),class:p.class,session:p.session,dates:p.dates,updated_at:new Date().toISOString()}));
      const results=await Promise.allSettled([
        sbUpsert("sabaq_records",records.map(sbMapSabaqOut)),
        sbUpsert("dor_records",dorRecords.map(sbMapDorOut)),
        sbUpsert("daily_sabaq",dailySabaqEntries.map(sbMapDailyOut)),
        sbUpsert("register_data",registerData.map(sbMapRegisterOut)),
        sbUpsert("year_plan",planRows),
        sbUpsert("app_settings",[
          {key:"adminPassword",value:getAdminPassword(),updated_at:new Date().toISOString()},
          {key:"htEmail",value:htEmail||"",updated_at:new Date().toISOString()}
        ],"key")
      ]);
      const failures=results.filter(r=>r.status==="rejected");
      if(failures.length>0){console.warn("syncNow partial failures:",failures.map(f=>f.reason?.message||f.reason));}
      const anyOk=results.some(r=>r.status==="fulfilled");
      if(anyOk){setSyncStatus("live");}
      else{setSyncStatus("offline");}
    }catch(e){
      console.error("syncNow",e);
      setSyncStatus("offline");
    }finally{
      isSyncing.current=false;
      if(pendingSync.current){pendingSync.current=false;scheduleSync();}
    }
  }
  async function loadCloud(){
    setSyncStatus("loading");
    async function tryLoad(fn){try{return {ok:true,data:await fn()};}catch(e){console.warn("loadCloud partial:",e.message);return {ok:false,data:[]};} }
    const [sR,dR,dlR,rR,pR,stR]=await Promise.all([
      tryLoad(()=>sbFetchAll("sabaq_records?select=*&order=date_from.desc")),
      tryLoad(()=>sbFetchAll("dor_records?select=*&order=date.desc")),
      tryLoad(()=>sbFetchAll("daily_sabaq?select=*&order=date.desc")),
      tryLoad(()=>sbFetchAll("register_data?select=*&order=date.desc")),
      tryLoad(()=>sbFetchAll("year_plan?select=*")),
      tryLoad(()=>sbFetchAll("app_settings?select=*")),
    ]);
    if(sR.ok){try{const d=sR.data.map(sbMapSabaqIn).map(sanitiseRecord).filter(Boolean);setRecords(d);lsSave(d);}catch(e){console.warn("loadCloud set records:",e.message);}}
    if(dR.ok){try{const d=dR.data.map(sbMapDorIn).map(sanitiseDor).filter(Boolean);setDorRecords(d);lsSaveDor(d);}catch(e){console.warn("loadCloud set dor:",e.message);}}
    if(dlR.ok){try{const d=dlR.data.map(sbMapDailyIn).map(sanitiseDaily).filter(Boolean);setDailySabaqEntries(d);lsSaveDailySabaq(d);}catch(e){console.warn("loadCloud set daily:",e.message);}}
    if(rR.ok){try{const d=rR.data.map(sbMapRegisterIn).map(sanitiseRegister).filter(Boolean);setRegisterData(d);lsSaveRegister(d);}catch(e){console.warn("loadCloud set register:",e.message);}}
    if(pR.ok){try{setYearPlan(pR.data);lsSaveYearPlan(pR.data);}catch(e){console.warn("loadCloud set plan:",e.message);}}
    if(stR.ok){
      const pw=stR.data.find(r=>r.key==="adminPassword");
      if(pw&&pw.value)localStorage.setItem("adminPassword",pw.value);
      const ht=stR.data.find(r=>r.key==="htEmail");
      if(ht&&ht.value!==undefined){setHtEmail(ht.value);lsSaveHT(ht.value);}
    }
    isFirstLoad.current=false;
    var anyLoaded=sR.ok||dR.ok||dlR.ok||rR.ok||pR.ok||stR.ok;
    if(anyLoaded){setSyncStatus("live");scheduleSync();}
    else{setSyncStatus("offline");}
  }

function SabaqEntryPage({studentNames,records,dorRecords,setRecords,setDorRecords,dailySabaqEntries,setDailySabaqEntries,selectedClass,selectedDate,syncNow,yearPlan,registerData,hafidhStudents}){
  const today=getTodayStr();

  const _studentsByClass=React.useMemo(()=>{

    }});

  },[records]);
  function getClassStudents(c){return [...(_studentsByClass[c]||new Set())].sort();}

  const EMPTY_AM=name=>({
    name,absent:false,
    spMistakes:"",spScrape:false,spKaccha:false,
    sp2Done:false,sp2Mistakes:"",sp2Scrape:false,sp2Kaccha:false,

    dor2Juz:"",dor2Quarter:"",dor2Mistakes:"",
  });
  function bufFromSaved(sv,dorRecs){
    const base=EMPTY_AM(sv.studentName);
    if(sv.absent)return{...base,absent:true};
    var _dr2=(dorRecs||[]).find(function(d){return d.studentName===sv.studentName&&d.date===sv.date&&d.morningDor;});
    return{...base,absent:false,
      spMistakes:(sv.spMistakes!==undefined&&sv.spMistakes!==null)?String(sv.spMistakes):"",
      spScrape:!!sv.spScrape,spKaccha:!!sv.spKaccha2,
      sp2Done:!!sv.sp2Done,sp2Mistakes:sv.sp2Done?String(sv.sp2Mistakes||0):"",
      sp2Scrape:!!sv.sp2Scrape,sp2Kaccha:!!sv.sp2Kaccha,
      sabaqLines:sv.sabaqLines?String(sv.sabaqLines):"13",
      sabaqWeak:!!sv.sabaqWeak,sabaqLessLines:!!sv.sabaqLessLines,
      dorDone:!!(sv.morningDor!==undefined?sv.morningDor:sv.paraDor),dorJuz:sv.pdJuz||"",dorQuarter:normQuarter(sv.pdQuarter||""),
      dorMistakes:sv.pdMistakes?String(sv.pdMistakes):"",
      dorKaccha:!!(sv.pdKaccha!==undefined?sv.pdKaccha:sv.pdScrape),
      dorScrape:!!(sv.pdKaccha!==undefined&&sv.pdScrape),
      dorNoTime:!!sv.pdNoTime,
      dorParaDor:sv.pdIsParaDor!==undefined?!!sv.pdIsParaDor:!!sv.paraDor,
      // dor2 lives in dor_records (not in daily_sabaq), so look it up by studentName+date
      dor2Juz:(_dr2&&_dr2.dor2Juz)||"",
      dor2Quarter:normQuarter((_dr2&&_dr2.dor2Quarter)||""),
      dor2Mistakes:(_dr2&&_dr2.dor2Mistakes)?String(_dr2.dor2Mistakes):"",
    };
  }
  function initAM(name){
    const sv=(dailySabaqEntries||[]).find(e=>e.class===cls&&e.date===date&&e.studentName===name);
    if(sv)return bufFromSaved(sv,dorRecords);
    const rk=getRegisterKey(cls,"morning",date);
    const reg=(registerData||[]).find(r=>r.key===rk&&r.studentName===name);
    // Auto-prefill next Dor quarter for Hafidh students from yesterday's last record
    var prefillJuz="",prefillQ="";
    if(hafidhStudents&&hafidhStudents.has(name)&&Array.isArray(dorRecords)){
      var _prev=new Date(date);_prev.setDate(_prev.getDate()-1);
      var _prevStr=_prev.toISOString().slice(0,10);
      var _prevDors=(dorRecords||[]).filter(function(d){return d.studentName===name&&d.date===_prevStr&&d.morningDor;});
      if(_prevDors.length>0){
        var _ld=_prevDors[_prevDors.length-1];
        // Use the highest quarter read yesterday (dor2 takes priority over dor1)
        var _lj=parseInt((_ld.dor2Juz&&_ld.dor2Quarter)?_ld.dor2Juz:_ld.dor1Juz)||0;
        var _lq=(_ld.dor2Juz&&_ld.dor2Quarter)?_ld.dor2Quarter:(_ld.dor1Quarter||"");
        var _qMap={"1":"Q2","2":"Q3","3":"Q4","4":"Q1"};
        var _qN=_qMap[_lq];
        if(_qN){prefillJuz=_lq==="4"?String(_lj>=30?1:_lj+1):String(_lj);prefillQ=_qN;}
      }
    }
    return{...EMPTY_AM(name),absent:!!(reg&&(reg.status==="A"||reg.status==="AG")),
      dorJuz:prefillJuz,dorQuarter:prefillQ};
  }

      daily.push({

        sabaqWeak:!row.absent&&row.sabaqWeak,
        sabaqLessLines:!row.absent&&row.sabaqLessLines,
        sabaqKaccha:!row.absent&&(row.sabaqWeak||row.sabaqLessLines),
        paraDor:!row.absent&&(row.dorDone||(hafidhStudents&&hafidhStudents.has(row.name)))&&row.dorParaDor,

function getMonthsForPlanner(startYear, startMonth, count){
  const months=[];
  let y=startYear||new Date().getFullYear();
  let m=startMonth||new Date().getMonth()+1;
  const n=count||12;
  for(let i=0;i<n;i++){
    const d=new Date(y,m-1,1);
    const wkStart=getWeekNumber(d);
    months.push({year:y,month:m,
      label:d.toLocaleString("default",{month:"long"})+" "+y,
      shortLabel:d.toLocaleString("default",{month:"short"}),
      wkStart});
    m++;if(m>12){m=1;y++;}
  }
  return months;
}

function getWeekNumber(d){
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=date.getUTCDay()||7;
  date.setUTCDate(date.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}

function getPlanDates(yearPlan,cls,session){
  // Try old format first
  const entry=yearPlan.find(p=>p.class===cls&&p.session===session);
  if(entry&&Array.isArray(entry.dates)&&entry.dates.length>0)return entry.dates;
  // Fall back to new year planner model (schedule + overrides + term bounds)
  const bounds=getTermBoundsFromPlan(yearPlan);
  const startD=bounds.termStart?new Date(bounds.termStart):new Date(new Date().getFullYear(),new Date().getMonth()-1,1);
  const endD=bounds.termEnd?new Date(bounds.termEnd):new Date(new Date().getFullYear(),new Date().getMonth()+14,0);
  const result=[];
  const cur=new Date(startD.getFullYear(),startD.getMonth(),1);
  while(cur<=endD){
    const y=cur.getFullYear(),m=cur.getMonth()+1;
    const dim=new Date(y,m,0).getDate();
    for(let d=1;d<=dim;d++){
      if(!isTermExcluded(yearPlan,y,m,d)&&getDayPlanStatus(yearPlan,session,y,m,d)==="class")
        result.push({year:y,month:m,day:d});
    }
    cur.setMonth(cur.getMonth()+1);
  }
  return result;
}

function setPlanDates(yearPlan,setYearPlan,cls,session,dates){
  // Validate and sanitise dates before storing
  const validDates=dates.filter(function(d){
    return d&&typeof d.year==="number"&&typeof d.month==="number"&&typeof d.day==="number"
      &&d.year>=2020&&d.year<=2040
      &&d.month>=1&&d.month<=12
      &&d.day>=1&&d.day<=31;
  });
  setYearPlan(prev=>{
    const next=prev.filter(p=>!(p.class===cls&&p.session===session));
    next.push({id:cls+"_"+session,class:cls,session,dates:validDates});
    return next;
  });
}

function getHolidayDates(yearPlan){
  const entry=yearPlan.find(p=>p.class==="__holidays__");
  return entry?entry.dates:[];
}

function setHolidayDates(yearPlan,setYearPlan,dates){
  setYearPlan(prev=>{
    const next=prev.filter(p=>p.class!=="__holidays__");
    next.push({id:"__holidays__",class:"__holidays__",session:"",dates});
    return next;
  });
}

function getSpecialDates(yearPlan,type){
  const entry=yearPlan.find(p=>p.class==="__special__"&&p.session===type);
  return entry?entry.dates:[];
}

function setSpecialDates(yearPlan,setYearPlan,type,dates){
  setYearPlan(prev=>{
    const next=prev.filter(p=>!(p.class==="__special__"&&p.session===type));
    next.push({id:"__special__"+type,class:"__special__",session:type,dates});
    return next;
  });
}

function getHolidayRanges(yearPlan){
  const entry=yearPlan.find(p=>p.class==="__holiday_ranges__");
  return entry?entry.dates:[];
}

function setHolidayRanges(yearPlan,setYearPlan,ranges){
  setYearPlan(prev=>{

}

function setPlanDatesMulti(setYearPlan,updates){
  setYearPlan(prev=>{
    let next=[...prev];
    updates.forEach(function({cls,session,dates}){
      const validDates=dates.filter(function(d){
        return d&&typeof d.year==="number"&&typeof d.month==="number"&&typeof d.day==="number"
          &&d.year>=2020&&d.year<=2040&&d.month>=1&&d.month<=12&&d.day>=1&&d.day<=31;
      });
      next=next.filter(p=>!(p.class===cls&&p.session===session));
      next.push({id:cls+"_"+session,class:cls,session,dates:validDates});
    });
    return next;
  });
}

function getSessionSchedule(yearPlan,session){
  const e=yearPlan.find(p=>p.class==="__sched__"&&p.session===session);
  const d=e&&(e.dates||e.days); // dates = synced field; days = old localStorage format
  if(Array.isArray(d))return d;
  return session==="morning"?[1,2,3,4,5,6]:[1,2,3,4,5];
}
function setSessionSchedule(setYearPlan,session,days){
  setYearPlan(prev=>{
    const next=prev.filter(p=>!(p.class==="__sched__"&&p.session===session));
    next.push({id:"__sched__"+session,class:"__sched__",session,dates:days});
    return next;
  });
}
function getSessionOverrides(yearPlan,session){
  const e=yearPlan.find(p=>p.class==="__ov__"&&p.session===session);
  const d=e&&(e.dates||e.overrides); // dates = synced field; overrides = old localStorage format
  return Array.isArray(d)?d:[];
}
function setSessionOverrides(setYearPlan,session,overrides){
  setYearPlan(prev=>{
    const next=prev.filter(p=>!(p.class==="__ov__"&&p.session===session));
    next.push({id:"__ov__"+session,class:"__ov__",session,dates:overrides});
    return next;
  });
}
function getDayPlanStatus(yearPlan,session,year,month,day){
  const ovs=getSessionOverrides(yearPlan,session);
  const ov=ovs.find(o=>o.year===year&&o.month===month&&o.day===day);
  if(ov)return ov.status;
  const ranges=getHolidayRanges(yearPlan);
  const holDates=getHolidayDates(yearPlan);
  if(isDateInRanges(year,month,day,ranges))return"holiday";
  if(holDates.some(d=>d.year===year&&d.month===month&&d.day===day))return"holiday";
  for(const t of["exam","parents","boys_jalsa","girls_jalsa"]){
    const dates=getSpecialDates(yearPlan,t);
    if(dates.some(d=>d.year===year&&d.month===month&&d.day===day))return t;
  }
  const sched=getSessionSchedule(yearPlan,session);
  const dow=new Date(year,month-1,day).getDay();
  if(!sched.includes(dow))return null;
  return"class";
}

function getTermBoundsFromPlan(yearPlan){
  const e=yearPlan.find(r=>r.id==="__term__");
  const d=e&&(e.dates||(e.termStart?{termStart:e.termStart,termEnd:e.termEnd}:null));
  return d?{termStart:d.termStart||null,termEnd:d.termEnd||null}:{termStart:null,termEnd:null};
}
function isTermExcluded(yearPlan,year,month,day){
  const{termStart,termEnd}=getTermBoundsFromPlan(yearPlan);
  const dt=new Date(year,month-1,day);
  if(termStart){const s=new Date(termStart);if(dt<s)return true;}
  if(termEnd){const e=new Date(termEnd);if(dt>e)return true;}
  return false;
}
function getClassDatesForMonth(yearPlan,session,year,month){
  const daysInMonth=new Date(year,month,0).getDate();
  const result=[];
  for(let d=1;d<=daysInMonth;d++){
    if(isTermExcluded(yearPlan,year,month,d))continue;
    if(getDayPlanStatus(yearPlan,session,year,month,d)==="class")result.push({year,month,day:d});
  }
  return result;
}

function isDateInRanges(year,month,day,ranges){
  const ts=new Date(year,month-1,day).getTime();
  return ranges.some(r=>{
    if(!r.from||!r.to)return false;
    const from=new Date(r.from).getTime();
    const to=new Date(r.to).getTime();
    return ts>=from&&ts<=to;
  });
}

function formatDateDMYShort(d){
  if(!d)return"";
  const parts=d.split("-");
  if(parts.length!==3)return d;
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}

function getRegisterKey(cls,session,date){return cls+"||"+session+"||"+date;}

// Build O(1) lookup Map: "key||studentName" → entry
function buildRegisterIndex(registerData){
  const m=new Map();
  if(!Array.isArray(registerData))return m;
  registerData.forEach(r=>{ if(r.key&&r.studentName)m.set(r.key+"||"+r.studentName,r); });
  return m;
}
function getStudentStatus(registerData,cls,session,date,name,idx){
  const key=getRegisterKey(cls,session,date);
  const safeRD=Array.isArray(registerData)?registerData:[];
  const entry=idx?idx.get(key+"||"+name):safeRD.find(r=>r.key===key&&r.studentName===name);
  return entry||{status:"P",minutesLate:0,absenceReason:"",madeUp:false,msgSent:false};
}

}

// ─── PLANNER CALENDAR VIEW COMPONENT ──────────────────────────
function PlannerCalendarView({yearPlan,months,cls,SPECIAL_TYPES,termBounds}){
  const DOW=["Su","M","Tu","W","Th","F","S"];

  function isExcluded(year,month,day){
    if(!termBounds)return false;
    const d=new Date(year,month-1,day);
    if(termBounds.termStart){const s=new Date(termBounds.termStart);if(d<s)return true;}
    if(termBounds.termEnd){const e=new Date(termBounds.termEnd);if(d>e)return true;}
    return false;
  }

  function getDayType(year,month,day){
    if(isExcluded(year,month,day))return"excluded";
    const mornSt=getDayPlanStatus(yearPlan,"morning",year,month,day);
    const eveSt=getDayPlanStatus(yearPlan,"evening",year,month,day);
    if(mornSt&&mornSt!=="class")return mornSt;
    if(eveSt&&eveSt!=="class")return eveSt;
    if(mornSt==="class")return"morning";
    if(eveSt==="class")return"evening";
    return null;
  }

  const TYPE_COLORS={
    excluded:{bg:"repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 3px,#e9eaec 3px,#e9eaec 6px)",text:"#d1d5db"},
    holiday:{bg:"#DC2626",text:"#fff"},
    exam:{bg:"#16a34a",text:"#fff"},
    parents:{bg:"#eab308",text:"#fff"},
    boys_jalsa:{bg:"#ea580c",text:"#fff"},
    girls_jalsa:{bg:"#7c3aed",text:"#fff"},
    morning:{bg:"#B8934A",text:"#fff"},
    evening:{bg:"#2563eb",text:"#fff"},
  };

  return(
    React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12}},
      months.map((m,mi)=>{
        const firstDay=new Date(m.year,m.month-1,1).getDay();
        const daysInMonth=new Date(m.year,m.month,0).getDate();
        const wkNum=getWeekNumber(new Date(m.year,m.month-1,1));
        const cells=[];
        for(let i=0;i<firstDay;i++)cells.push(null);
        for(let d=1;d<=daysInMonth;d++)cells.push(d);
        while(cells.length%7!==0)cells.push(null);
        return React.createElement('div',{key:mi,style:{background:"#fff",borderRadius:12,border:"1px solid #e5e7eb",overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}},

// ── PDF PRINT HTML builder ─────────────────────────────────────
function buildPlannerPrintHTML(yearPlan,months,cls,SPECIAL_TYPES){
  const DOW=["Su","M","Tu","W","Th","F","S"];
  const TYPE_COLORS={
    holiday:"#DC2626",exam:"#16a34a",parents:"#eab308",
    boys_jalsa:"#ea580c",girls_jalsa:"#7c3aed",
    morning:"#B8934A",evening:"#2563eb",
  };

  function getDayType(year,month,day){
    if(isTermExcluded(yearPlan,year,month,day))return"excluded";
    const mornSt=getDayPlanStatus(yearPlan,"morning",year,month,day);
    const eveSt=getDayPlanStatus(yearPlan,"evening",year,month,day);
    if(mornSt&&mornSt!=="class")return mornSt;
    if(eveSt&&eveSt!=="class")return eveSt;
    if(mornSt==="class")return"morning";
    if(eveSt==="class")return"evening";
    return null;
  }

  function monthHTML(m){
    const firstDay=new Date(m.year,m.month-1,1).getDay();
    const daysInMonth=new Date(m.year,m.month,0).getDate();
    const wkNum=getWeekNumber(new Date(m.year,m.month-1,1));
    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(null);
    for(let d=1;d<=daysInMonth;d++)cells.push(d);
    while(cells.length%7!==0)cells.push(null);
    let html=`<div class="month"><div class="month-hdr">${m.label}</div>`;
    html+=`<table class="cal"><thead><tr><th>Wk</th>${DOW.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>`;
    for(let r=0;r<cells.length/7;r++){
      const weekCells=cells.slice(r*7,r*7+7);
      const firstDate=weekCells.find(d=>d);
      const wk=firstDate?getWeekNumber(new Date(m.year,m.month-1,firstDate)):"-";
      html+=`<tr><td class="wk">${wk}</td>`;
      weekCells.forEach((day,ci)=>{
        if(!day){html+=`<td></td>`;return;}
        const type=getDayType(m.year,m.month,day);
        const color=type&&type!=="excluded"?TYPE_COLORS[type]:"";
        const isSunSat=ci===0||ci===6;
        const excl=type==="excluded";
        const bg=excl?"repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 2px,#e5e7eb 2px,#e5e7eb 4px)":color?color:isSunSat?"#e5e7eb":"#fff";
        const tc=excl?"#d1d5db":color?"#fff":isSunSat?"#9CA3AF":"#1a1f2e";
        html+=`<td style="background:${bg};color:${tc};font-weight:${color&&!excl?"700":"400"}">${day}</td>`;
      });
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
    return html;
  }

  const legend=SPECIAL_TYPES.map(st=>`<div class="leg-item"><div class="leg-dot" style="background:${TYPE_COLORS[st.key]||"#ddd"}"></div>${st.label}</div>`).join("")
    +`<div class="leg-item"><div class="leg-dot" style="background:#B8934A"></div>Morning Session</div>`
    +`<div class="leg-item"><div class="leg-dot" style="background:#2563eb"></div>Evening Session</div>`;

  return`<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@page{size:A4 landscape;margin:10mm;}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
body{font-family:Arial,sans-serif;font-size:11px;margin:0;color:#1a1f2e;}
.title{text-align:center;font-size:16px;font-weight:700;margin-bottom:12px;color:#1e2d3d;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.month{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;}
.month-hdr{background:#1e2d3d;color:#fff;text-align:center;font-weight:700;padding:6px;font-size:12px;}
.cal{width:100%;border-collapse:collapse;}
.cal th{background:#374151;color:#fff;padding:3px 2px;text-align:center;font-size:9px;font-weight:600;}
.cal td{text-align:center;padding:3px 2px;border:1px solid #f3f4f6;font-size:10px;border-radius:2px;}
.cal td.wk{color:#9CA3AF;font-size:9px;font-weight:600;background:#F8F9FA;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding:8px 12px;background:#F8F9FA;border-radius:8px;align-items:center;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;}
.leg-dot{width:12px;height:12px;border-radius:2px;}
h2{text-align:center;color:#1e2d3d;margin:0 0 10px;}
</style></head><body>
<h2>Madrasah Al-Ihsaan — Hifz Year Planner (${cls})</h2>
<div class="grid">${months.map(m=>monthHTML(m)).join("")}</div>
<div class="legend">${legend}</div>
</body></html>`;
}

    return regIdx.get(key+"||"+name)||null;
  }

  function cycleStatus(name,date){
    const entry=getEntry(name,date);
    const cur=entry?entry.status:null;
    let next;
    if(!cur)next="P";
    else if(cur==="P")next="A";
    else if(cur==="A")next="AG";
    else next=null;
    const key=getRegisterKey(cls,session,date);
    if(next===null){
      setRegisterData(prev=>prev.filter(r=>!(r.key===key&&r.studentName===name)));
    }else{
      setRegisterData(prev=>{
        const ei=prev.findIndex(r=>r.key===key&&r.studentName===name);
        const base=ei>=0?prev[ei]:{key,class:cls,session,date,studentName:name,minutesLate:0,absenceReason:"",madeUp:false,msgSent:false};
        const updated={...base,status:next,madeUp:next==="AG"};
        if(ei>=0){const n=[...prev];n[ei]=updated;return n;}
        return[...prev,updated];
      });
    }
    setUnsaved(true);
  }

  function openReason(name,date){
    const entry=getEntry(name,date);
    setReasonText((entry&&entry.absenceReason)||"");
    setReasonModal({name,date});
  }

  function saveReason(){
    if(!reasonModal)return;
    const{name,date}=reasonModal;
    const key=getRegisterKey(cls,session,date);
    setRegisterData(prev=>{
      const ei=prev.findIndex(r=>r.key===key&&r.studentName===name);
      if(ei<0){
        const newEntry={key,class:cls,session,date,studentName:name,status:"A",minutesLate:0,absenceReason:reasonText,madeUp:false,msgSent:false};
        return[...prev,newEntry];
      }
      const n=[...prev];
      n[ei]={...n[ei],absenceReason:reasonText};
      return n;
    });
    setReasonModal(null);
    setUnsaved(true);
  }

  function saveChanges(){

    setUnsaved(false);

    if(status==="AG")return{background:"#2563eb",color:"#fff",fontWeight:"700",borderRadius:6,padding:"4px 6px",minWidth:30,display:"inline-block",textAlign:"center",fontSize:12};
    return{background:"#F3F4F6",color:"#9CA3AF",borderRadius:6,padding:"4px 6px",minWidth:30,display:"inline-block",textAlign:"center",fontSize:12};

function AbsencesPage({yearPlan,registerData,setRegisterData,records,syncNow}){
    const [cls,setCls]=React.useState("HIFZ CLASS A");
  const [month,setMonth]=React.useState(getTodayStr().substring(0,7));
  const [editMsg,setEditMsg]=React.useState({});
  const [defaultMsg]=React.useState(()=>getWAMessage("[Student Name]"));
  const [customMsgs,setCustomMsgs]=React.useState({});

  const studs=React.useMemo(()=>[
    ...new Set(records.filter(r=>r.class===cls&&r.name&&!r.name.startsWith("(")).map(r=>r.name))
  ].sort(),[records,cls]);
  function getStudents(){return studs;}

  // Pre-filter once per class+month — avoids O(studentsÃ—registerData) per render
  const monthAbsEntries=React.useMemo(()=>{
    if(!Array.isArray(registerData))return[];
    return registerData.filter(r=>
      r.class===cls&&(r.status==="A"||r.status==="AG")&&
      (!month||r.date.startsWith(month))
    );
  },[registerData,cls,month]);

  function getAbsences(){
    const byName={};
    monthAbsEntries.forEach(r=>{
      if(!byName[r.studentName])byName[r.studentName]=[];
      byName[r.studentName].push(r);
    });
    return getStudents()
      .filter(n=>byName[n])
      .map(n=>({name:n,absences:byName[n].sort((a,b)=>(a.date||"").localeCompare(b.date||""))}));
  }

  function markMadeUp(name,date,session){
    const key=getRegisterKey(cls,session,date);
    setRegisterData(prev=>{
      const idx=prev.findIndex(r=>r.key===key&&r.studentName===name);
      if(idx<0)return prev;
      const next=[...prev];
      next[idx]={...next[idx],status:"AG",madeUp:true};
      lsSaveRegister(next);
      return next;
    });
    syncNow().catch(()=>{});
  }

  function letOff(name,date,session){
    const key=getRegisterKey(cls,session,date);
    setRegisterData(prev=>{
      const idx=prev.findIndex(r=>r.key===key&&r.studentName===name);
      if(idx<0)return prev;
      const next=[...prev];
      next[idx]={...next[idx],status:"AG",madeUp:true,letOff:true};
      lsSaveRegister(next);
      return next;
    });
    syncNow().catch(()=>{});
  }

  function sendWAMsg(name,phone,date){
    const msg=(customMsgs&&customMsgs[name+date])||getWAMessage(name||"");
    const encoded=encodeURIComponent(msg);
    const ph=(phone||"").replace(/\D/g,"");
    const url=ph?`https://wa.me/${ph}?text=${encoded}`:`https://web.whatsapp.com/send?text=${encoded}`;
    window.open(url,"_blank");
    // Mark as sent
    const abs=registerData.filter(r=>r.studentName===name&&r.date===date&&(r.status==="A"||r.status==="AG"));
    abs.forEach(a=>{
      setRegisterData(prev=>{
        const idx=prev.findIndex(r=>r.key===a.key&&r.studentName===name);
        if(idx<0)return prev;
        const next=[...prev];
        next[idx]={...next[idx],msgSent:true};
        lsSaveRegister(next);
        return next;
      });
    });
  }

  const absenceList=getAbsences();
  const pending=absenceList.filter(a=>a.absences.some(e=>e.status==="A"&&!e.msgSent));
  const scheduled=absenceList.filter(a=>a.absences.some(e=>e.msgSent&&e.status!=="AG"));
  const allPlanMonths=[...new Set(getPlanDates(yearPlan,cls,"morning").concat(getPlanDates(yearPlan,cls,"evening")).map(d=>d.year+"-"+String(d.month).padStart(2,"0")))].sort();

  return(
    React.createElement('div',{style:{padding:"20px 16px",maxWidth:700,margin:"0 auto"}},
      React.createElement('div',{style:{color:"#1a1f2e",fontWeight:"700",fontSize:18,marginBottom:16}},"⚠️ Absences"),

      React.createElement('div',{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16,alignItems:"center"}},
        CLASSES.map(c=>React.createElement('button',{key:c,onClick:()=>setCls(c),
          style:{background:cls===c?"#B8934A":"transparent",color:cls===c?"#fff":"#6b7280",border:"1px solid "+(cls===c?"#B8934A":"rgba(184,147,74,0.3)"),borderRadius:20,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:cls===c?"600":"400"}},c)),
        React.createElement('select',{value:month,onChange:e=>setMonth(e.target.value),
          style:{border:"1px solid rgba(184,147,74,0.3)",borderRadius:8,padding:"6px 10px",fontSize:12,outline:"none",marginLeft:"auto"}},
          React.createElement('option',{value:""},"All months"),
          allPlanMonths.filter(Boolean).map(m=>{
            const [y,mo]=(m||"-").split("-");

            return React.createElement('option',{key:m,value:m},lbl);
          })
        )
      ),

      /* Pending absences */
      pending.length>0&&React.createElement('div',null,
        React.createElement('div',{style:{color:"#374151",fontWeight:"600",fontSize:14,marginBottom:10}},"📬 Action Required ("+pending.length+" students)"),
        pending.map(({name,absences})=>{
          const pendingAbs=absences.filter(e=>e.status==="A"&&!e.msgSent);
          const latestRec=records.filter(r=>r.name===name).sort((a,b)=>(b.dateFrom||"").localeCompare(a.dateFrom||""))[0];
          const phone=latestRec?(latestRec.fatherPhone||latestRec.motherPhone||""):"";
          return React.createElement('div',{key:name,style:{background:"#fff",borderRadius:14,border:"1.5px solid #FCA5A5",padding:"16px 18px",marginBottom:12,boxShadow:"0 2px 8px rgba(220,38,38,0.07)"}},
            React.createElement('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}},
              React.createElement('div',null,
                React.createElement('div',{style:{color:"#1a1f2e",fontWeight:"600",fontSize:14}},name),
                React.createElement('div',{style:{color:"#DC2626",fontSize:11.5,marginTop:2,fontWeight:"600"}},

            /* One row per absence — date left, actions right */

                  React.createElement('div',{style:{display:"flex",alignItems:"center",gap:9,minWidth:0}},
                    React.createElement('div',null,
                      React.createElement('div',{style:{fontSize:12.5,fontWeight:"700",color:"#1a1f2e"}},dayName),
                      React.createElement('div',{style:{fontSize:11,color:"#6b7280",fontWeight:"600"}},formatDateDMYShort(e.date))
                    ),
                    React.createElement('span',{style:{fontSize:9,fontWeight:"800",
                      color:e.session==="morning"?"#0EA5E9":"#4F46E5",
                      background:e.session==="morning"?"rgba(14,165,233,0.1)":"rgba(79,70,229,0.1)",
                      border:"1px solid "+(e.session==="morning"?"rgba(14,165,233,0.35)":"rgba(79,70,229,0.35)"),
                      borderRadius:6,padding:"2px 7px",letterSpacing:"0.4px"}},e.session==="morning"?"AM":"PM")
                  ),
                  React.createElement('div',{style:{display:"flex",gap:6,flexShrink:0}},
                    React.createElement('button',{onClick:()=>markMadeUp(name,e.date,e.session),
                      style:{background:"#F0FDF4",color:"#16a34a",border:"1.5px solid #86EFAC",borderRadius:8,padding:"7px 11px",cursor:"pointer",fontSize:11,fontWeight:"700"}},"\u2713 Made Up"),
                    React.createElement('button',{onClick:()=>letOff(name,e.date,e.session),
                      style:{background:"#F8FAFC",color:"#475569",border:"1.5px solid #CBD5E1",borderRadius:8,padding:"7px 11px",cursor:"pointer",fontSize:11,fontWeight:"700"}},"Let Off")
                  )
                );
              })
            ),
            /* WhatsApp message - editable */
            React.createElement('div',null,
              React.createElement('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
                React.createElement('span',{style:{color:"#6b7280",fontSize:11,fontWeight:"600",letterSpacing:"0.5px"}},"MESSAGE")
              ),
              React.createElement('textarea',{
                value:customMsgs[name]!==undefined?customMsgs[name]:getWAMessage(name),
                onChange:e=>setCustomMsgs(p=>({...p,[name]:e.target.value})),
                style:{width:"100%",borderRadius:8,border:"1px solid #E5E7EB",padding:"10px",fontSize:11,lineHeight:1.6,resize:"vertical",minHeight:160,outline:"none",color:"#374151",fontFamily:"inherit"},
                dir:"auto"
              }),
              React.createElement('div',{style:{marginTop:10}},
                React.createElement('button',{
                  onClick:()=>pendingAbs.forEach(e=>sendWAMsg(name,phone,e.date)),
                  style:{background:"linear-gradient(135deg,#3FD974,#2EC96A)",color:"#fff",border:"none",borderRadius:12,padding:"13px 18px",cursor:"pointer",fontWeight:"800",fontSize:13.5,display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",boxShadow:"0 4px 12px rgba(46,201,106,0.35)",letterSpacing:"0.2px"}

      pending.length===0&&React.createElement('div',{style:{background:"#fff",border:"1.5px solid #BBF7D0",borderRadius:16,padding:"36px 20px",textAlign:"center",marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}},
        React.createElement('div',{style:{fontSize:30,marginBottom:8}},"\u2705"),

        React.createElement('div',{style:{color:"#374151",fontWeight:"600",fontSize:14,marginBottom:10}},"📅 Make-up Session Scheduled"),
