// Reads daily sabaq entries + register data for a student/month
// Returns a pre-filled record matching defaultEntry shape
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

// ─────────────────────────────────────────────────────────────────────────────
// MONTHLY REPORT PAGE
// ─────────────────────────────────────────────────────────────────────────────
function MonthlyReportPage({records,dailySabaqEntries,dorRecords,registerData,hafidhStudents}){
  var today=getTodayStr();
  var curMonth=today.substring(0,7);
  var [cls,setCls]=React.useState("HIFZ CLASS A");
  var [month,setMonth]=React.useState(curMonth);
  var [generated,setGenerated]=React.useState(false);
  var [reportData,setReportData]=React.useState(null);

  var classes=["HIFZ CLASS A","HIFZ CLASS B"];

  function generate(){
    // Get all students in this class
    var studentSet=new Set();
    (records||[]).forEach(function(rec){
      if(rec.class===cls&&rec.name&&!rec.name.startsWith("("))studentSet.add(rec.name);
    });
    var students=[...studentSet].sort();
    if(students.length===0){showToast("No students found in "+cls,"warning");return;}

    // Build per-student summaries
    var data=students.map(function(name){
      var isHafidh=hafidhStudents&&hafidhStudents.has(name);
      var entries=(dailySabaqEntries||[]).filter(function(e){
        return e.studentName===name&&e.class===cls&&e.date&&e.date.startsWith(month);
      }).sort(function(a,b){return a.date.localeCompare(b.date);});

      var present=entries.filter(function(e){return !e.absent;});
      var absent=entries.filter(function(e){return e.absent;});

      // Sabaq Para stats
      var spDays=present.filter(function(e){return e.sabaqPara&&!e.paraDor;});
      var spMkTotal=spDays.reduce(function(s,e){return s+(parseFloat(e.spMistakes)||0);},0);
      var avgSpMk=spDays.length>0?Math.round(spMkTotal/spDays.length*10)/10:0;
      var kachaCount=spDays.filter(function(e){return e.spKaccha2||e.spKaccha;}).length;
      var weakCount=spDays.filter(function(e){return e.sabaqWeak;}).length;
      var sp2Count=spDays.filter(function(e){return e.sp2Done;}).length;

      // Sabaq lines
      var totalLines=spDays.reduce(function(s,e){return s+(parseFloat(e.sabaqLines)||parseFloat(e.spLines)||0);},0);
      var avgLines=spDays.length>0?Math.round(totalLines/spDays.length*10)/10:0;

      // Dor records for this month
      var dorList=(dorRecords||[]).filter(function(d){
        return d.studentName===name&&d.date&&d.date.startsWith(month);
      }).sort(function(a,b){return a.date.localeCompare(b.date);});

      // Dor heat map: one entry per session per day
      var dorMap={};
      dorList.forEach(function(d){
        var key=d.date+(d.morningDor?"M":"E");
        dorMap[key]={date:d.date,session:d.morningDor?"AM":"PM",
          juz1:d.dor1Juz||"",q1:d.dor1Quarter||"",mk1:d.dor1Mistakes||"",rep1:!!d.dor1Repeated,
          juz2:d.dor2Juz||"",q2:d.dor2Quarter||"",mk2:d.dor2Mistakes||""};
      });
      var dorEntries=Object.values(dorMap).sort(function(a,b){return a.date.localeCompare(b.date)||(a.session==="AM"?-1:1);});

      // Morning Dor via daily_sabaq (for completeness)
      var morningDorDays=present.filter(function(e){return e.morningDor||e.paraDor;}).length;

      return{name,isHafidh,
        presentDays:present.length,absentDays:absent.length,
        sabaqDays:spDays.length,totalLines,avgLines,
        avgSpMk,kachaCount,weakCount,sp2Count,
        morningDorDays,dorEntries};
    });

    setReportData({cls,month,students:data});
    setGenerated(true);
  }

  function mkColor(mk){
    var m=parseFloat(mk)||0;
    if(m===0)return{bg:"#ECFDF5",color:"#16a34a"};
    if(m<=1.5)return{bg:"#F0FDF4",color:"#15803d"};
    if(m<=3)return{bg:"#FEF3C7",color:"#D97706"};
    return{bg:"#FEE2E2",color:"#DC2626"};
  }

  return React.createElement("div",{style:{padding:"18px 16px 40px",maxWidth:760,margin:"0 auto"}},
    React.createElement(PageTitle,{title:"Monthly Report",sub:"Class sabaq & Dor summary"}),

    // Controls
    React.createElement("div",{style:{background:"#fff",borderRadius:16,border:"1px solid #E5E7EB",
      padding:"18px 20px",marginBottom:20,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}},
      React.createElement("div",{style:{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}},
        React.createElement("div",{style:{flex:1,minWidth:160}},
          React.createElement("label",{style:{fontSize:11,fontWeight:"700",color:MUTED,letterSpacing:"0.6px",
            textTransform:"uppercase",display:"block",marginBottom:6}},"Class"),
          React.createElement("div",{style:{display:"flex",gap:8}},
            classes.map(function(c){
              var sel=cls===c;
              return React.createElement("button",{key:c,onClick:function(){setCls(c);setGenerated(false);},
                style:{padding:"9px 16px",borderRadius:10,border:"1.5px solid "+(sel?GOLD:"#E5E7EB"),
                  background:sel?GOLD:"#fff",color:sel?"#fff":TEXT,
                  cursor:"pointer",fontWeight:"700",fontSize:13}},
                c.replace("HIFZ CLASS ","Class "));
            })
          )
        ),
        React.createElement("div",{style:{minWidth:160}},
          React.createElement("label",{style:{fontSize:11,fontWeight:"700",color:MUTED,letterSpacing:"0.6px",
            textTransform:"uppercase",display:"block",marginBottom:6}},"Month"),
          React.createElement("input",{type:"month",value:month,
            onChange:function(e){setMonth(e.target.value);setGenerated(false);},
            style:{padding:"9px 12px",borderRadius:10,border:"1px solid #E5E7EB",
              fontSize:15,width:"100%",outline:"none"}})
        ),
        React.createElement("button",{onClick:generate,
          style:{padding:"10px 24px",borderRadius:10,border:"none",
            background:"linear-gradient(135deg,#0d6b5e,#1a8a7a)",color:"#fff",
            cursor:"pointer",fontWeight:"700",fontSize:14,
            boxShadow:"0 2px 8px rgba(13,107,94,0.3)",whiteSpace:"nowrap"}},
          "Generate Report")
      )
    ),

    // Report output
    generated&&reportData&&React.createElement("div",null,
      React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}},
        React.createElement("div",{style:{color:GOLD,fontWeight:"700",fontSize:15}},
          reportData.cls.replace("HIFZ ","")+" — "+reportData.month),
        React.createElement("button",{onClick:function(){window.print();},
          style:{padding:"8px 18px",borderRadius:10,border:"1px solid #E5E7EB",
            background:"#fff",color:TEXT,cursor:"pointer",fontSize:13,fontWeight:"600"}},
          "🖨️ Print")
      ),

      reportData.students.map(function(s){
        var hasData=s.presentDays>0||s.dorEntries.length>0;
        return React.createElement("div",{key:s.name,style:{
          background:"#fff",borderRadius:16,border:"1px solid #E5E7EB",
          marginBottom:14,overflow:"hidden",
          boxShadow:"0 1px 3px rgba(0,0,0,0.05)"
        }},
          // Header
          React.createElement("div",{style:{
            background:"linear-gradient(135deg,#07150e,#0d2018)",
            padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"
          }},
            React.createElement("div",null,
              React.createElement("div",{style:{color:"#fff",fontWeight:"700",fontSize:16}},s.name),
              s.isHafidh&&React.createElement("span",{style:{
                background:"rgba(201,165,83,0.25)",color:GOLD,
                fontSize:10,fontWeight:"700",letterSpacing:"0.6px",
                borderRadius:4,padding:"1px 8px",marginTop:3,display:"inline-block"
              }},"HAFIDH")
            ),
            React.createElement("div",{style:{textAlign:"right"}},
              React.createElement("div",{style:{color:"rgba(255,255,255,0.7)",fontSize:12}},
                s.presentDays+" present · "+s.absentDays+" absent"),
              s.absentDays>0&&React.createElement("div",{style:{color:"#EF4444",fontSize:11,fontWeight:"600",marginTop:2}},
                Math.round(s.absentDays/(s.presentDays+s.absentDays)*100)+"% absent")
            )
          ),

          !hasData
            ? React.createElement("div",{style:{padding:"20px",textAlign:"center",color:MUTED,fontSize:14}},"No entries recorded this month.")
            : React.createElement("div",{style:{padding:"16px 18px"}},

              // Sabaq stats (non-Hafidh or has data)
              !s.isHafidh&&s.sabaqDays>0&&React.createElement("div",{style:{marginBottom:16}},
                React.createElement("div",{style:{fontSize:11,fontWeight:"800",color:MUTED,
                  letterSpacing:"0.7px",textTransform:"uppercase",marginBottom:10}},"Sabaq Summary"),
                React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}},
                  [
                    {label:"Sabaq Days",value:String(s.sabaqDays),color:"#059669"},
                    {label:"Avg Lines/Day",value:String(s.avgLines),color:"#2563EB"},
                    {label:"Avg SP Mistakes",value:String(s.avgSpMk),color:s.avgSpMk>3?"#DC2626":s.avgSpMk>1.5?"#D97706":"#16a34a"},
                    {label:"Kaccha",value:String(s.kachaCount),color:s.kachaCount>0?"#DC2626":MUTED},
                  ].map(function(stat){
                    return React.createElement("div",{key:stat.label,style:{
                      background:"#F9FAFB",borderRadius:10,padding:"10px 12px",textAlign:"center"
                    }},
                      React.createElement("div",{style:{fontSize:18,fontWeight:"800",color:stat.color}},stat.value),
                      React.createElement("div",{style:{fontSize:10,fontWeight:"600",color:MUTED,
                        textTransform:"uppercase",letterSpacing:"0.5px",marginTop:3}},stat.label)
                    );
                  })
                ),
                // Extra flags
                (s.weakCount>0||s.sp2Count>0)&&React.createElement("div",{style:{
                  display:"flex",gap:8,marginTop:8,flexWrap:"wrap"
                }},
                  s.weakCount>0&&React.createElement("span",{style:{
                    background:"#FEF3C7",color:"#D97706",
                    fontSize:11,fontWeight:"700",borderRadius:6,padding:"3px 10px"
                  }},"⚠️ Weak: "+s.weakCount+" days"),
                  s.sp2Count>0&&React.createElement("span",{style:{
                    background:"#FEE2E2",color:"#DC2626",
                    fontSize:11,fontWeight:"700",borderRadius:6,padding:"3px 10px"
                  }},"🔴 2nd Attempt: "+s.sp2Count+" days")
                )
              ),

              // Dor entries heat map
              s.dorEntries.length>0&&React.createElement("div",null,
                React.createElement("div",{style:{fontSize:11,fontWeight:"800",color:MUTED,
                  letterSpacing:"0.7px",textTransform:"uppercase",marginBottom:10}},"Dor Log"),
                React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
                  s.dorEntries.map(function(d,i){
                    var c1=mkColor(d.mk1);
                    var dateShort=d.date.slice(5); // MM-DD
                    return React.createElement("div",{key:d.date+d.session+i,style:{
                      border:"1px solid #E5E7EB",borderRadius:8,padding:"6px 10px",
                      minWidth:90,background:d.rep1?"#FFF5F5":"#FAFAFA"
                    }},
                      React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}},
                        React.createElement("span",{style:{fontSize:11,fontWeight:"700",color:MUTED}},dateShort),
                        React.createElement("span",{style:{fontSize:9.5,fontWeight:"700",color:"#6B7280",
                          background:"#F3F4F6",borderRadius:4,padding:"1px 5px"
                        }},d.session)
                      ),
                      // Quarter 1
                      React.createElement("div",{style:{
                        background:c1.bg,borderRadius:5,padding:"3px 8px",
                        display:"inline-flex",alignItems:"center",gap:5,marginBottom:d.juz2?3:0

                        React.createElement("span",{style:{fontSize:11,fontWeight:"700",color:c1.color}},
                          "J"+d.juz1+(d.q1?" "+d.q1:"")),
                        d.mk1!==""&&React.createElement("span",{style:{fontSize:10,color:c1.color}},d.mk1+"mk")
                      ),
                      // Quarter 2 (if exists)
                      d.juz2&&React.createElement("div",{style:{
                        background:mkColor(d.mk2).bg,borderRadius:5,padding:"3px 8px",
                        display:"inline-flex",alignItems:"center",gap:5
                      }},
                        React.createElement("span",{style:{fontSize:11,fontWeight:"700",color:mkColor(d.mk2).color}},
                          "J"+d.juz2+(d.q2?" "+d.q2:"")),
                        d.mk2!==""&&React.createElement("span",{style:{fontSize:10,color:mkColor(d.mk2).color}},d.mk2+"mk")
                      ),
                      d.rep1&&React.createElement("div",{style:{fontSize:9.5,color:"#DC2626",fontWeight:"700",marginTop:2}},"Kaccha")
                    );
                  })
                )
              ),

              // Attendance summary
              s.presentDays===0&&React.createElement("div",{style:{color:MUTED,fontSize:13,textAlign:"center",padding:"8px 0"}},
                "All absent or no register data.")
            )
        );
      })
    )
  );
}

function collateMonthlyRecord(studentName, cls, yearMonth, dailySabaqEntries, registerData, existingRecords, dateFrom, dateTo){
  // yearMonth = "YYYY-MM" (used for month-based filter when dateFrom/dateTo not provided)
  // dateFrom / dateTo = "YYYY-MM-DD" for custom range
  const LINES_PER_SIDE = 13;
  const useRange = !!(dateFrom && dateTo);

  // ── 1. Get all daily entries for this student/class/period ──
  const dailies = (dailySabaqEntries||[]).filter(e=>{
    if(!e.studentName===studentName||e.class!==cls||!e.date)return false;
    if(e.studentName!==studentName)return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  });

  if(dailies.length===0){
    return null; // No daily data for this period
  }

  // ── 2. Compute from daily entries ──
  const presentDays = dailies.filter(e=>!e.absent);
  const absentDays  = dailies.filter(e=>e.absent);

  // Days where Para Dor was done (morning replaced by Para Dor)
  const paraDorMornings = presentDays.filter(e=>e.paraDor).length;

  // Sabaq Para days (present and recited sabaq)
  const sabaqParaDays = presentDays.filter(e=>e.sabaqPara&&!e.paraDor);

  // Total days that count as "sabaq days" = present & sabaqPara & not paraDor
  const totalDaysOfSabaq = sabaqParaDays.length;

  // Sabaq (new lesson) lines — from sabaqLines field
  const totalLines = presentDays
    .filter(e=>e.sabaqPara&&!e.paraDor)
    .reduce((sum,e)=>sum+(parseFloat(e.sabaqLines)||parseFloat(e.spLines)||0), 0);

  // Total full sides = floor(totalLines / LINES_PER_SIDE)
  const totalFullSides = Math.floor(totalLines / LINES_PER_SIDE);
  // Plus lines = remainder
  const plusLines = Math.round(totalLines % LINES_PER_SIDE);

  // ── Quality metrics from daily entries ──
  // Sabaq Para mistakes
  const spDays = presentDays.filter(e=>e.sabaqPara&&!e.paraDor);
  const spMistakesTotal = spDays.reduce((s,e)=>s+(parseFloat(e.spMistakes)||0),0);
  const avgSpMistakes = spDays.length>0 ? Math.round(spMistakesTotal/spDays.length*10)/10 : 0;
  // Sabaq Para scrape/kaccha counts
  const spScrapeCount = spDays.filter(e=>e.spScrape).length;
  const spKacchaCount = spDays.filter(e=>e.spKaccha2||e.spKaccha).length;
  // 2nd attempt counts
  const sp2Count = spDays.filter(e=>e.sp2Done).length;
  const sp2ScrapeCount = spDays.filter(e=>e.sp2Done&&e.sp2Scrape).length;
  const sp2KacchaCount = spDays.filter(e=>e.sp2Done&&e.sp2Kaccha).length;
  // Sabaq quality
  const sabaqWeakCount = presentDays.filter(e=>e.sabaqWeak).length;
  const sabaqLessLinesCount = presentDays.filter(e=>e.sabaqLessLines).length;

  // Absences from register (more reliable than daily entries for absences)
  // Count distinct dates where student was marked A or AG in register
  const regAbsences = (registerData||[]).filter(e=>{
    if(e.studentName!==studentName||e.class!==cls||!e.date)return false;
    if(!(e.status==="A"||e.status==="AG"))return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  });
  // Deduplicate by distinct DATE (avoid double-counting morning+evening absences)
  const regAbsentDates = [...new Set(regAbsences.map(e=>e.date))];
  const absences = regAbsentDates.length > 0 ? regAbsentDates.length : absentDays.length;

  // Evening absences from register
  const eveningRegAbsences = (registerData||[]).filter(e=>{
    if(e.studentName!==studentName||e.class!==cls||e.session!=="evening"||!e.date)return false;
    if(!(e.status==="A"||e.status==="AG"))return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  }).length;

  // Evening possible days from register (distinct evening session dates)
  const eveningPossibleDays = [...new Set((registerData||[]).filter(e=>{
    if(e.class!==cls||e.session!=="evening"||!e.date)return false;
    if(useRange) return e.date>=dateFrom && e.date<=dateTo;
    return e.date.startsWith(yearMonth);
  }).map(e=>e.date))].length;

  // ── 3. Date range from daily entries ──
  const sortedDates = dailies.map(e=>e.date).sort();
  const recDateFrom = sortedDates[0] || (useRange ? dateFrom : yearMonth+"-01");
  const recDateTo   = sortedDates[sortedDates.length-1] || recDateFrom;

  // ── 4. Pull contact info from most recent existing record ──
  const prevRecords = (existingRecords||[])
    .filter(r=>r.name===studentName && r.class===cls)
    .sort((a,b)=>(b.dateFrom||"").localeCompare(a.dateFrom||""));
  const prevRec = prevRecords[0] || {};

  // ── 5. Determine sensible upcomingTarget ──
  // If average >= 11, keep target at 13. Below 10 drop to 10.
  const avg = totalDaysOfSabaq > 0 ? totalLines / totalDaysOfSabaq : 0;
  const upcomingTarget = avg >= 11 ? 13 : avg >= 8 ? 11 : 10;

  // Auto-calculate toPage from fromPage + lines covered
  const fromPageNum = parseInt(prevRec.toPage||0)||0;
  // Each full side = 1 page (both sides of a leaf = 2 pages)
  // A Quran page has 15 lines typically but we use 13 per side
  // totalFullSides / 2 = full leaves. Each leaf = 2 pages.
  const pagesFromLines = Math.floor(totalFullSides / 2);
  const autoToPage = fromPageNum > 0 ? fromPageNum + pagesFromLines : "";

  // Missing data check — which dates in the range had no entries?
  const coveredDates = new Set(dailies.map(e=>e.date));
  let missingDates = [];
  if(useRange){
    const cur = new Date(dateFrom);
    const end = new Date(dateTo);
    while(cur<=end){
      const ds = cur.toISOString().slice(0,10);
      const dow = cur.getDay();
      // Only flag weekdays (Mon-Fri) as potentially missing
      if(dow!==0&&dow!==6&&!coveredDates.has(ds)) missingDates.push(ds);
      cur.setDate(cur.getDate()+1);
    }
    // Limit to first 5 to keep report readable
    if(missingDates.length>5) missingDates = [missingDates[0]+"...and "+(missingDates.length-1)+" more"];
  }

  return {
    id:"",
    name: studentName,
    class: cls,
    fromPage:  fromPageNum > 0 ? String(fromPageNum) : "",
    toPage:    autoToPage ? String(autoToPage) : "",
    totalFullSides: String(totalFullSides),
    plusLines:      String(plusLines),
    absences:       String(absences),
    paraDorMornings: String(paraDorMornings),
    totalDaysOfSabaq: String(totalDaysOfSabaq),
    dateFrom: recDateFrom,
    dateTo:   recDateTo,
    targetGiven:    prevRec.upcomingTarget || 13,
    upcomingTarget,
    parentEmail1:   prevRec.parentEmail1 || "",
    parentEmail2:   prevRec.parentEmail2 || "",
    fatherPhone:    prevRec.fatherPhone  || "",
    motherPhone:    prevRec.motherPhone  || "",
    weakSabaqInstances: sabaqWeakCount>0 ? String(sabaqWeakCount) : "0",
    weakDorInstances:   "N/A",
    avgSpMistakes:      String(avgSpMistakes),
    spScrapeCount:      String(spScrapeCount),
    spKacchaCount:      String(spKacchaCount),
    sp2Count:           String(sp2Count),
    sp2ScrapeCount:     String(sp2ScrapeCount),
    sp2KacchaCount:     String(sp2KacchaCount),
    sabaqLessLinesCount:String(sabaqLessLinesCount),
    teacherComments: "",   // Teacher fills in
    behaviour:       prevRec.behaviour || 5,
    eveningPossibleDays: String(eveningPossibleDays||""),
    eveningAbsences:     String(eveningRegAbsences||""),
    // Metadata for display in the form
    _collated: true,
    _dailyCount: dailies.length,
    _presentCount: presentDays.length,
    _totalLines: totalLines,
    _avgLines: totalDaysOfSabaq > 0 ? Math.round(totalLines/totalDaysOfSabaq*10)/10 : 0,
    _missingDates: missingDates,
    _fromPage: fromPageNum,
    _autoToPage: autoToPage,
  };
}

// Get list of months that have daily sabaq data for a student
function getCollationMonths(studentName, cls, dailySabaqEntries){
  if(!studentName||!cls)return[];
  const months = [...new Set(
    (dailySabaqEntries||[])
      .filter(e=>e.studentName===studentName && e.class===cls && e.date)
      .map(e=>e.date.substring(0,7))
  )].sort().reverse();
  return months;
}


function exportCSV(data,fields,filename){
  if(!data||data.length===0){showToast("No data to export.","warning");return;}
  function escVal(v){
    if(v===null||v===undefined)return"";
    var s=String(v).replace(/"/g,"\"\"");
    if(s.indexOf(",")>=0||s.indexOf("\n")>=0||s.indexOf("\"")>=0)s="\""+s+"\"";
    return s;
  }
  var header=fields.join(",");
  var rows=data.map(function(r){return fields.map(function(f){return escVal(r[f]);}).join(",");});
  var csv="\uFEFF"+header+"\n"+rows.join("\n");
  try{
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download=filename+"_"+getTodayStr()+".csv";
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},100);
  }catch(e){showToast("Export failed: "+e.message,"error");}
}
function exportAllReports(records,dorRecords,calced){
  if(!records||records.length===0){showToast("No records to export.","warning");return;}
  var students=[];
  var seen={};
  records.filter(function(r){return!r.isStudentProfile;}).forEach(function(r){if(r.name&&!seen[r.name]){seen[r.name]=true;students.push(r.name);}});
  var h="<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Reports</title>";
  h+="<style>@media print{.sr{page-break-after:always;}}body{font-family:Arial,sans-serif;margin:20px;}</style></head><body>";
  h+="<h1>Al-Ihsaan Academy Hifz Reports &#8212; "+getTodayStr()+"</h1>";
  students.forEach(function(n){

function LineChart({data,color}){
  if(!data||data.length===0)return React.createElement("div",{style:{color:"#6b7280",fontSize:12,textAlign:"center",padding:20}},"No data yet");
  const vals=data.map(function(d){return d.value||0;});
  const maxV=Math.max.apply(null,vals)||1;
  const minV=Math.min.apply(null,vals)||0;
  const W=300,H=80,PAD=10;
  const pts=data.map(function(d,i){
    const x=PAD+(i/(Math.max(data.length-1,1)))*(W-PAD*2);
    const y=H-PAD-((d.value-minV)/(maxV-minV||1))*(H-PAD*2);
    return x+","+y;
  }).join(" ");
  return React.createElement("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:H}},
    React.createElement("polyline",{points:pts,fill:"none",stroke:color||"#B8934A",strokeWidth:"2",strokeLinejoin:"round",strokeLinecap:"round"}),
    data.length>0&&(()=>{ const lastPt=(pts.split(" ").filter(Boolean).pop()||"0,0").split(","); return React.createElement("circle",{cx:lastPt[0]||0,cy:lastPt[1]||0,r:"3",fill:color||"#B8934A"}); })()
  );
}


// ── Error Boundary ─────────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){console.error("App crashed:",error,info&&info.componentStack);}
  render(){
    if(this.state.hasError){
      return React.createElement("div",{
        style:{padding:32,textAlign:"center",fontFamily:"Inter,sans-serif",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#F8F9FA"}
      },
        React.createElement("div",{style:{fontSize:40,marginBottom:16}},"\u26A0\uFE0F"),
        React.createElement("div",{style:{fontWeight:700,fontSize:20,marginBottom:8,color:"#B8934A"}},"Something went wrong"),
        React.createElement("div",{style:{color:"#6b7280",fontSize:14,marginBottom:24,maxWidth:400}},
          "The app encountered an unexpected error. Your data is safe."
        ),
        React.createElement("button",{
          onClick:()=>this.setState({hasError:false,error:null}),
          style:{background:"#B8934A",color:"#fff",border:"none",borderRadius:10,padding:"12px 28px",cursor:"pointer",fontWeight:600,fontSize:15,marginRight:12}
        },"Try Again"),
        React.createElement("button",{
          onClick:()=>window.location.reload(),
          style:{background:"transparent",color:"#6b7280",border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 28px",cursor:"pointer",fontWeight:600,fontSize:15}
        },"Reload App"),
        this.state.error&&React.createElement("details",{style:{marginTop:20,maxWidth:500,textAlign:"left",color:"#9ca3af",fontSize:11}},
          React.createElement("summary",{style:{cursor:"pointer"}},"Technical details"),
          React.createElement("pre",{style:{marginTop:8,whiteSpace:"pre-wrap",wordBreak:"break-all"}},String(this.state.error))
        )
      );
    }
    return this.props.children;
  }
}

}
