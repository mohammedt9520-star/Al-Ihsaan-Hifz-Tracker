// ══════════════════════════════════════════════════════════════
// STUDENT SALAAH ENTRY (installable page, scope /salaah/)
// Contains none of the main app. Talks to the same Supabase tables:
//   salaah_records (write today's scores), sabaq_records (student names/classes),
//   app_settings (left students), salaah_settings (tracked salaahs, locked months).
// Own localStorage keys: salaahKioskStudents, salaahKioskSettings, salaahKioskData, salaahKioskPending
// Students can re-save a salaah they already entered today (last save wins). Today only.
// ══════════════════════════════════════════════════════════════
const KIOSK_VERSION="salaah-kiosk-20261103-171500";
const SUPABASE_URL="https://yyfkoenhpotzcuwxpnsy.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5ZmtvZW5ocG90emN1d3hwbnN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDM4NzgsImV4cCI6MjA5NTg3OTg3OH0.UDVDhOZgvtMcN89F1hz0725nmVJ7bCLW-BjUxhKZs4g";
const IDLE_MS=120000;
const GOLD="#c9a553",TEXT="#1b241d",MUTED="#6d7a6e",BORDER="#e6e1d3",GREEN="#16a34a",RED="#dc2626";
const SALAAHS=[{key:"fajr",label:"Fajr"},{key:"dhuhr",label:"Dhuhr"},{key:"asr",label:"Asr"},{key:"maghrib",label:"Maghrib"},{key:"esha",label:"Esha"}];
const DEFAULT_ENABLED={fajr:true,dhuhr:false,asr:false,maghrib:false,esha:true};
const CLASSES=[{cls:"HIFZ CLASS A",label:"Hifz A"},{cls:"HIFZ CLASS B",label:"Hifz B"}];
const COLORS=["#dc6a64","#e8914f","#e2a940","#c4b24a","#8dbb55","#4aa06f"];
const KEY=["Jammat + Takbeer-e-oola + Sunnah Muakkadah","Jamaat + did not miss a rakaat + Sunnah Muakkadah","Jamaat but missed rakat(s) / Sunnah Muakkadah","Prayed at home Fardh + Sunnah Muakkadah","Prayed at home only Fardh","Missed Salaah"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function pad(n){return n<10?"0"+n:""+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function ord(n){var j=n%10,k=n%100;return n+(j===1&&k!==11?"st":j===2&&k!==12?"nd":j===3&&k!==13?"rd":"th");}
function hijri(d){try{return new Intl.DateTimeFormat("en-GB-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(d);}catch(e){return "";}}
function lsGet(k,fb){try{var v=JSON.parse(localStorage.getItem(k));return v==null?fb:v;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
// Same ID the admin app assigns to students that have no unique_id (so scores always land on the same student).
function hashId(str){var x=5381;for(var i=0;i<str.length;i++)x=((x*33)^str.charCodeAt(i))>>>0;return "STU-"+x.toString(36).toUpperCase().padStart(6,"0").slice(-6);}
async function api(path,method,body){
  const h={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
  if(method==="POST")h["Prefer"]="resolution=merge-duplicates,return=minimal";
  const ctrl=new AbortController();const t=setTimeout(function(){ctrl.abort();},20000);
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{method:method||"GET",headers:h,body:body?JSON.stringify(body):undefined,signal:ctrl.signal});
    if(!r.ok)throw new Error(r.status+"");
    const txt=await r.text();return txt?JSON.parse(txt):[];
  }finally{clearTimeout(t);}
}
function buildStudents(recs,left){
  var isReal=function(n){if(!n||n.startsWith("(")||n.startsWith("*"))return false;var l=n.toLowerCase();return !["instances","1-5","dd/mm"].some(function(w){return l.includes(w);});};
  var by={};
  recs.forEach(function(r){
    if(!r||!isReal(r.name)||!r.class)return;
    var e=by[r.name]||(by[r.name]={name:r.name,cls:r.class,uid:"",dt:"",cdt:""});
    var d=r.date_from||"";
    if(!r.is_student_profile&&d>=e.dt){e.dt=d;e.cls=r.class;}
    else if(!e.dt&&!e.cdt){e.cls=r.class;}
    if(r.unique_id&&String(r.unique_id).trim()&&d>=e.cdt){e.uid=String(r.unique_id).trim();e.cdt=d;}
  });
  return Object.keys(by).filter(function(n){return !left[n];}).map(function(n){var e=by[n];return{id:e.uid||hashId(n.trim().toUpperCase()),name:n,cls:e.cls};})
    .filter(function(s){return s.cls==="HIFZ CLASS A"||s.cls==="HIFZ CLASS B";}).sort(function(a,b){return a.name.localeCompare(b.name);});
}

function App(){
  const h=React.createElement;
  const [now,setNow]=React.useState(new Date());
  const [students,setStudents]=React.useState(function(){return lsGet("salaahKioskStudents",[]);});
  const [settings,setSettings]=React.useState(function(){var s=lsGet("salaahKioskSettings",null);return s&&s.enabled?s:{enabled:DEFAULT_ENABLED,locked:[]};});
  const [saved,setSaved]=React.useState(function(){var d=lsGet("salaahKioskData",{});return d.date===ymd(new Date())?d.rows||{}:{};}); // "studentId|salaah" -> score for TODAY
  const [online,setOnline]=React.useState(true);
  const [cls,setCls]=React.useState("HIFZ CLASS A");
  const [sel,setSel]=React.useState(null);
  const [scores,setScores]=React.useState({});
  const [search,setSearch]=React.useState("");
  const [saving,setSaving]=React.useState(false);
  const [done,setDone]=React.useState("");
  const [pending,setPending]=React.useState(null);
  const lastAct=React.useRef(Date.now());
  const pendRef=React.useRef(lsGet("salaahKioskPending",[]));
  const today=ymd(now);
  const month=today.substring(0,7);
  const locked=settings.locked.indexOf(month)>=0;
  const sals=SALAAHS.filter(function(s){return settings.enabled[s.key];});
  const savedRef=React.useRef(saved);savedRef.current=saved;

  const load=React.useCallback(async function(){
    try{
      await flush();
      const day=ymd(new Date());
      const res=await Promise.all([
        api("sabaq_records?select=name,class,unique_id,is_student_profile,date_from&order=date_from.desc&limit=5000"),
        api("app_settings?select=key,value&key=eq.leftStudents"),
        api("salaah_settings?select=*"),
        api("salaah_records?select=student_id,salaah,score&date=eq."+day)
      ]);
      var left={};try{if(res[1][0]&&res[1][0].value)left=JSON.parse(res[1][0].value)||{};}catch(e){}
      var st=buildStudents(res[0],left);setStudents(st);lsSet("salaahKioskStudents",st);
      var next={enabled:Object.assign({},DEFAULT_ENABLED),locked:[]};
      res[2].forEach(function(r){try{if(r.key==="enabled")next.enabled=Object.assign({},DEFAULT_ENABLED,JSON.parse(r.value));if(r.key==="locked")next.locked=JSON.parse(r.value);}catch(e){}});
      setSettings(next);lsSet("salaahKioskSettings",next);
      var m={};res[3].forEach(function(r){if(r.score!=null)m[r.student_id+"|"+r.salaah]=r.score;});
      pendRef.current.forEach(function(o){var k=o.row.student_id+"|"+o.row.salaah;if(o.k==="del")delete m[k];else m[k]=o.row.score;});
      setSaved(m);lsSet("salaahKioskData",{date:day,rows:m});
      setOnline(true);
    }catch(e){setOnline(false);}
  },[]);
  async function flush(){
    var q=pendRef.current.slice();
    for(var i=0;i<q.length;i++){
      try{
        if(q[i].k==="del")await api("salaah_records?student_id=eq."+encodeURIComponent(q[i].row.student_id)+"&date=eq."+q[i].row.date+"&salaah=eq."+q[i].row.salaah,"DELETE");
        else await api("salaah_records?on_conflict=student_id,date,salaah","POST",[Object.assign({},q[i].row,{updated_at:new Date().toISOString()})]);
        pendRef.current=pendRef.current.filter(function(x){return x!==q[i];});lsSet("salaahKioskPending",pendRef.current);}
      catch(e){return false;}
    }
    return true;
  }
  React.useEffect(function(){
    load();
    var iv=setInterval(function(){setNow(new Date());load();},20000);
    var clock=setInterval(function(){setNow(new Date());},30000);
    var on=function(){load();};
    window.addEventListener("online",on);document.addEventListener("visibilitychange",function(){if(!document.hidden)load();});
    return function(){clearInterval(iv);clearInterval(clock);window.removeEventListener("online",on);};
  },[load]);
  // Back to the name list when nobody has touched the screen for a while, so the next child starts fresh.
  React.useEffect(function(){
    var iv=setInterval(function(){if(sel&&Date.now()-lastAct.current>IDLE_MS){setSel(null);setScores({});setPending(null);}},5000);
    return function(){clearInterval(iv);};
  },[sel]);
  React.useEffect(function(){window.__kioskBusy=!!sel;if(!sel&&window.__kioskReload){location.reload();}},[sel]);
  function touch(){lastAct.current=Date.now();}

  const savedFor=function(stu,key){var v=saved[stu.id+"|"+key];return v===undefined?null:v;};
  const doneToday=function(stu){return sals.length>0&&sals.every(function(s){return savedFor(stu,s.key)!==null;});};
  const anyToday=function(stu){return sals.some(function(s){return savedFor(stu,s.key)!==null;});};
  function pick(stu){touch();setSel(stu);setScores(function(){var o={};sals.forEach(function(s){var v=saved[stu.id+"|"+s.key];if(v!==undefined)o[s.key]=v;});return o;});setDone("");}
  // scores[key]: a number = chosen, null = cleared, missing = untouched
  function baseline(s){var v=savedFor(sel,s.key);return v===null?undefined:v;}
  function cur(s){var v=scores[s.key];return v===null?undefined:v;}
  var dirty=!!sel&&sals.some(function(s){return cur(s)!==baseline(s);});
  function guard(a){touch();if(dirty)setPending({run:a});else a();}
  function reset(){setSel(null);setScores({});setSearch("");}
  async function save(after){
    if(!sel||locked||saving)return;
    var ops=[];
    sals.forEach(function(s){
      var v=cur(s),b=baseline(s);
      if(v===b)return;
      var row={student_id:sel.id,student_name:sel.name,class:sel.cls,date:today,salaah:s.key,score:v===undefined?null:v};
      ops.push({k:v===undefined?"del":"up",row:row});
    });
    if(!ops.length){showToast("Tap a number first");return;}
    setSaving(true);
    var m=Object.assign({},saved);
    ops.forEach(function(o){var k=o.row.student_id+"|"+o.row.salaah;if(o.k==="del")delete m[k];else m[k]=o.row.score;pendRef.current=pendRef.current.concat([o]);});
    setSaved(m);lsSet("salaahKioskData",{date:today,rows:m});lsSet("salaahKioskPending",pendRef.current);
    var ok=await flush();setOnline(ok);
    setSaving(false);
    var nm=sel.name;
    setDone(ok?"Saved – "+nm+".  Jazakallah Khayran":"Saved on this device – it will upload when the internet is back");
    reset();
    setTimeout(function(){setDone("");},3500);
    if(typeof after==="function")after();
  }
  var toastT=React.useRef(null);const [toast,setToast]=React.useState("");
  function showToast(t){setToast(t);clearTimeout(toastT.current);toastT.current=setTimeout(function(){setToast("");},2200);}

  // ── UI pieces ──
  const wd=WD[now.getDay()],big=ord(now.getDate())+" "+MONTHS[now.getMonth()]+" "+now.getFullYear();
  const header=h("div",{style:{background:"#07150e",color:"#f7f4ec",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
    h("div",null,h("div",{style:{fontFamily:"Marcellus,Georgia,serif",fontSize:16}},"Al-Ihsaan Academy"),h("div",{style:{fontSize:9,letterSpacing:"0.18em",color:GOLD,fontWeight:800,textTransform:"uppercase",marginTop:1}},"Salaah Entry")),
    h("div",{title:online?"Connected":"Offline – saved on this device",style:{width:9,height:9,borderRadius:"50%",background:online?"#22c55e":"#ef4444"}}));
  const dateCard=h("div",{style:{background:"#fffdf7",border:"1px solid #e3d6a8",borderRadius:14,padding:"8px 10px",marginBottom:10,textAlign:"center"}},
    h("div",{style:{fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:"#8a6d1f",fontWeight:700}},wd+" · Today"),
    h("div",{style:{fontSize:"clamp(16px,4.8vw,20px)",fontWeight:700,fontFamily:"Marcellus,Georgia,serif"}},big),
    h("div",{style:{fontSize:11,color:MUTED}},hijri(now)));
  const doneCount=function(c){return students.filter(function(s){return s.cls===c&&doneToday(s);}).length;};
  const tabs=h("div",{style:{display:"flex",justifyContent:"center",marginBottom:10}},
    h("div",{style:{display:"inline-flex",background:"#ece7d6",borderRadius:20,padding:3,gap:2}},
      CLASSES.map(function(g){var on=cls===g.cls,tot=students.filter(function(s){return s.cls===g.cls;}).length;
        return h("button",{key:g.cls,onClick:function(){if(cls!==g.cls)guard(function(){setCls(g.cls);reset();});},style:{border:"none",borderRadius:17,padding:"8px 22px",fontSize:15,fontWeight:on?700:500,background:on?"#fff":"transparent",color:on?TEXT:MUTED,boxShadow:on?"0 1px 4px rgba(0,0,0,0.12)":"none"}},
          g.label,h("span",{style:{marginLeft:6,fontSize:11,fontWeight:600,color:on?"#8a6d1f":"#9aa59c"}},doneCount(g.cls)+"/"+tot));})));
  const keyBlock=h("div",{style:{background:"#fffdf6",border:"1.5px solid "+GOLD,borderRadius:12,padding:"7px 10px",marginTop:10}},
    h("div",{style:{fontSize:10,fontWeight:800,letterSpacing:"0.14em",textTransform:"uppercase",color:"#8a6d1f",marginBottom:3}},"Key"),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:"2px 14px"}},
      KEY.map(function(t,i){var sc=5-i;return h("div",{key:sc,style:{display:"flex",alignItems:"center",gap:8,fontSize:12.5,lineHeight:1.25}},
        h("span",{style:{flexShrink:0,width:21,height:21,borderRadius:6,background:COLORS[sc],color:"#fff",fontWeight:700,textAlign:"center",lineHeight:"21px",fontSize:12}},sc),h("span",null,t));})));

  var q=search.trim().toLowerCase();
  const picker=!sel&&!locked&&h("div",null,
    h("input",{type:"search",value:search,onChange:function(e){touch();setSearch(e.target.value);},placeholder:"🔍 Search name",style:{width:"100%",padding:"10px 12px",fontSize:15,border:"1px solid "+BORDER,borderRadius:10,marginBottom:10,outline:"none",background:"#fff"}}),
    (function(){
      var list=students.filter(function(s){return s.cls===cls&&(!q||s.name.toLowerCase().includes(q));});
      if(!list.length)return h("div",{style:{textAlign:"center",color:MUTED,padding:24}},students.length?"No students found.":"Loading…");
      return h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8}},
        list.map(function(s){var all=doneToday(s),some=anyToday(s);
          return h("button",{key:s.id,onClick:function(){pick(s);},style:{minHeight:52,padding:"6px 10px",borderRadius:12,border:"1px solid "+(all?"#9fd3b0":BORDER),background:all?"#f2faf5":"#fff",fontSize:15,fontWeight:600,color:TEXT,textAlign:"center",lineHeight:1.2,position:"relative"}},
            s.name,(all||some)&&h("span",{style:{position:"absolute",top:3,right:7,fontSize:10,color:all?GREEN:"#b8a25a"}},all?"✓✓":"✓"));}));
    })());

  const many=sals.length>2;
  const updating=sel&&sals.some(function(s){return savedFor(sel,s.key)!==null;});
  const entry=sel&&!locked&&h("div",null,
    h("div",{style:{background:"#fff",border:"1px solid "+BORDER,borderRadius:14,padding:"8px 12px 10px",marginBottom:updating?6:10,textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}},
      h("div",{style:{fontSize:10,letterSpacing:"0.16em",textTransform:"uppercase",color:"#8a6d1f",fontWeight:700}},(CLASSES.find(function(g){return g.cls===sel.cls;})||{}).label),
      h("div",{style:{fontSize:20,fontWeight:700,lineHeight:1.25}},sel.name),
      h("button",{onClick:function(){guard(reset);},style:{marginTop:5,padding:"5px 18px",borderRadius:14,border:"1px solid "+BORDER,background:"#faf8f1",color:"#5b6b5e",fontWeight:600,fontSize:12.5}},"Change")),
    updating&&h("div",{style:{textAlign:"center",marginBottom:8}},h("span",{style:{display:"inline-block",fontSize:11.5,fontWeight:700,color:"#92400e",background:"#fef3c7",border:"1px solid #fde68a",borderRadius:14,padding:"2px 12px"}},"Updating existing entry")),
    h("div",{style:{background:"#fff",border:"1px solid "+BORDER,borderRadius:14,padding:many?"2px 10px":"4px 12px",boxShadow:"0 1px 6px rgba(0,0,0,0.04)"}},
      sals.map(function(s,idx){
        return h("div",{key:s.key,style:{display:"flex",alignItems:"center",gap:8,padding:many?"5px 0":"8px 0",borderTop:idx?"1px solid #eee7d3":"none"}},
          h("div",{style:{width:many?62:72,flexShrink:0,fontSize:many?13.5:15,fontWeight:700}},s.label),
          h("div",{style:{flex:1,display:"flex",gap:many?4:6}},
            [0,1,2,3,4,5].map(function(n){var v=cur(s),on=v===n;
              return h("button",{key:n,onClick:function(){touch();setScores(function(p){var x=Object.assign({},p);x[s.key]=(cur(s)===n)?null:n;return x;});},"aria-label":s.label+" "+n,style:{flex:1,minWidth:0,height:many?42:48,borderRadius:10,border:"none",background:on?COLORS[n]:"#fff",color:on?"#fff":COLORS[n],fontSize:many?18:21,fontWeight:700,padding:0,boxShadow:on?"0 0 0 2px #fff, 0 0 0 3.5px "+COLORS[n]+", 0 3px 8px rgba(0,0,0,0.2)":"inset 0 0 0 1.5px "+COLORS[n]+"66",transform:on?"scale(1.05)":"none",opacity:v!==undefined&&!on?0.6:1}},n);})));
      })),
    h("button",{onClick:function(){touch();save();},disabled:saving,style:{width:"100%",height:48,borderRadius:12,border:"none",background:saving?"#9ca3af":GREEN,color:"#fff",fontSize:16,fontWeight:700,marginTop:10,boxShadow:"0 3px 10px rgba(22,163,74,0.3)"}},saving?"Saving…":"Save Entry"));

  const modal=function(children,onClose){return h("div",{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(7,21,14,0.55)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:14}},h("div",{onClick:function(e){e.stopPropagation();},style:{background:"#fff",borderRadius:16,maxWidth:360,width:"100%",padding:18,boxShadow:"0 20px 60px rgba(0,0,0,0.35)"}},children));};
  const unsavedDlg=pending&&modal(h("div",{style:{textAlign:"center"}},
    h("div",{style:{fontSize:17,fontWeight:700,marginBottom:4}},"Unsaved changes"),
    h("div",{style:{fontSize:13,color:MUTED,marginBottom:14}},"You picked scores but haven't saved them."),
    h("button",{onClick:function(){var run=pending.run;setPending(null);save(run);},style:{width:"100%",padding:11,borderRadius:11,border:"none",background:GREEN,color:"#fff",fontWeight:700,fontSize:15,marginBottom:8}},"Save"),
    h("button",{onClick:function(){var run=pending.run;setPending(null);run();},style:{width:"100%",padding:11,borderRadius:11,border:"1px solid #e5b3ae",background:"#fff5f4",color:"#b3423b",fontWeight:700,fontSize:15,marginBottom:8}},"Discard"),
    h("button",{onClick:function(){setPending(null);},style:{width:"100%",padding:9,border:"none",background:"transparent",color:MUTED,fontWeight:600,fontSize:14}},"Keep editing")),function(){setPending(null);});
  return h("div",{onClick:touch,onTouchStart:touch,style:{minHeight:"100vh",display:"flex",flexDirection:"column"}},
    header,
    h("div",{style:{flex:1,width:"100%",maxWidth:760,margin:"0 auto",padding:"12px 12px 30px"}},
      tabs,dateCard,
      done&&h("div",{style:{background:"#dcfce7",border:"1px solid #86efac",color:"#166534",borderRadius:12,padding:12,textAlign:"center",fontSize:16,fontWeight:700,marginBottom:10}},"✅ "+done),
      locked&&h("div",{style:{background:"#fef2f2",border:"1px solid #fca5a5",color:"#991b1b",borderRadius:12,padding:"16px 12px",textAlign:"center",fontSize:17,fontWeight:700,marginBottom:10}},"🔒 This month is locked"),
      !locked&&sals.length===0&&h("div",{style:{textAlign:"center",color:MUTED,padding:24}},"No salaahs are switched on yet."),
      picker,entry,keyBlock,
      h("div",{style:{textAlign:"center",fontSize:9,color:"#b5bcb6",marginTop:14}},KIOSK_VERSION)),
    toast&&h("div",{style:{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#07150e",color:"#fff",padding:"10px 18px",borderRadius:20,fontSize:14,zIndex:60}},toast),
